<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัญชีฝึกมือ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Workshop skin: paper, ink, key-style buttons, sticky notes. */
:root{
  --bg:#ECE6D9; --panel:#FFFCF5; --panel2:#F5EFE2; --ink:#25221D; --muted:#655E52; --line:#D8CFBD; --edge:#B9AE98;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FCE6D4; --accent-deep:#8F2F08;
  --note:#FFF1B8; --note-ink:#3D3214;
  --good:#237A36; --good-soft:#DDF1E2; --coin-ink:#946200; --bad:#C2255C; --bad-soft:#F8DDE7;
  --tap:24px; --ease:cubic-bezier(.2,.7,.2,1);
  --f-display:"Kanit","IBM Plex Sans Thai Looped",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai Looped",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171512; --panel:#201D19; --panel2:#282420; --ink:#EDE6D8; --muted:#A99F8E; --line:#3A352E; --edge:#4D463C;
  --accent:#FF7A33; --accent-ink:#1A0E06; --accent-soft:#3A2416; --accent-deep:#A8481A;
  --note:#3A3220; --note-ink:#F1E3B5;
  --good:#5BC26C; --good-soft:#16301C; --bad:#F06595; --bad-soft:#3A1726; --coin-ink:#F2B630;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#171512; --panel:#201D19; --panel2:#282420; --ink:#EDE6D8; --muted:#A99F8E; --line:#3A352E; --edge:#4D463C;
  --accent:#FF7A33; --accent-ink:#1A0E06; --accent-soft:#3A2416; --accent-deep:#A8481A;
  --note:#3A3220; --note-ink:#F1E3B5;
  --good:#5BC26C; --good-soft:#16301C; --bad:#F06595; --bad-soft:#3A1726; --coin-ink:#F2B630;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;margin:0;letter-spacing:0}
h2{font-size:19px;margin:22px 0 10px}
p{margin:0 0 8px}
ul,ol{list-style:none;margin:0;padding:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:14px}
.icon{flex:none;display:block}

/* page shell */
.page{max-width:760px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;min-height:48px;padding-bottom:6px}
.brand{font-family:var(--f-display);font-weight:600;font-size:20px}
.topnav{display:flex;gap:8px;flex-wrap:wrap}
.page-title{font-size:26px;margin:10px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.page-title:focus{outline:none}
.page-title:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* cards, rows */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.list{display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.row-main{flex:1 1 220px;min-width:0}
.row-title{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0 0 2px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .muted{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted);margin-right:4px}
.note{font-size:14px;color:var(--ink);background:var(--note);color:var(--note-ink);border-radius:2px;padding:10px 12px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 14px -8px rgba(60,45,0,.35)}

/* stars */
.stars{display:inline-flex;gap:1px;color:var(--coin-ink)}
.total{display:flex;align-items:center;gap:6px;font-size:16px;margin-bottom:4px}
.total .icon{color:var(--coin-ink)}
.total .num{font-size:22px;font-weight:500}

/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:8px 18px;align-items:center;background-image:linear-gradient(rgba(60,50,30,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(60,50,30,.06) 1px,transparent 1px);background-size:16px 16px}
.shop-art{width:100%;height:auto;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.stage-name{font-family:var(--f-display);font-weight:600;font-size:24px;margin-bottom:2px}
.ladder{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.ladder li{display:flex;align-items:center;gap:5px}
.ladder-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--edge);font-family:var(--f-mono);font-size:11px}
.ladder .done .ladder-n{background:var(--good);border-color:var(--good);color:var(--panel)}
.ladder .cur{color:var(--ink);font-weight:600}
.ladder .cur .ladder-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* buttons: keys with a bottom lip */
.btn{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.2;border-radius:5px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);padding:7px 14px;min-height:var(--tap);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;box-shadow:0 2px 0 var(--edge);transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 transparent}
.btn.sm{font-size:13px;padding:5px 10px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-deep);box-shadow:0 3px 0 var(--accent-deep)}
.btn.primary:hover{background:#B23B0A;border-color:var(--accent-deep)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;padding-left:4px}
.btn.ghost:hover{border-color:transparent;text-decoration-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--panel);}
[tabindex="-1"]:focus:not(:focus-visible){outline:none}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* settings */
.switch{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 0;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.switch-track{flex:none;width:46px;height:26px;border-radius:13px;border:2px solid var(--edge);background:var(--panel2);position:relative;transition:background-color .15s var(--ease)}
.switch-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s var(--ease)}
.switch[aria-checked="true"] .switch-track{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"] .switch-knob{transform:translateX(20px);background:var(--panel)}
.switch-label{flex:1;font-weight:500}
.switch-state{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:2.5em;text-align:right}
.reset-box{margin-top:8px}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:5px;padding:10px 12px}
.confirm p{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.confirm .icon{color:var(--bad);margin-top:3px}
.toast{margin-top:12px;display:flex;align-items:center;gap:6px;color:var(--good);font-weight:600}

/* summary dialog = sticky note */
.note-dialog{background:var(--note);color:var(--note-ink);border:0;border-radius:2px;padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;box-shadow:0 1px 0 rgba(0,0,0,.06),0 18px 40px -10px rgba(40,30,0,.45)}
.note-dialog::backdrop{background:rgba(30,25,15,.5)}
.note-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 4px;position:sticky;top:0;background:var(--note)}
.note-head h2{font-size:18px;margin:0;overflow-wrap:anywhere}
.note-head .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,currentColor 45%,transparent);box-shadow:none;flex:none}
.note-body{padding:4px 16px 16px;font-size:15px}
.note-body p{margin:0 0 10px}

/* narrow screens */
@media (max-width:560px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .shop-art{max-width:260px;margin:0 auto}
  .page-title{font-size:23px}
  .row-actions .btn,.row>.btn{flex:1 1 auto}
}

/* touch devices: 44px targets, 16px inputs */
@media (pointer:coarse){
  :root{--tap:44px}
  .btn.sm{padding-block:8px}
  .btn{padding-block:10px}
  input,select,textarea,.vj input,.vj select,.vt input,.vt select,.vcalc input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- play ---------- */
.play-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 8px}
.prob-h{font-size:18px;margin:0;font-family:var(--f-display)}
.prob-h:focus{outline:none}
.prob-h:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.problem-title{font-family:var(--f-display);font-weight:500;color:var(--muted);margin:0 0 4px;font-size:14px}
.problem-text{white-space:pre-line;margin:0;overflow-wrap:anywhere;font-size:16px}
.work{overflow:hidden}
.feedback{margin:4px 0 10px}
.feedback:empty{display:none}
.fb-ok,.fb-head{display:flex;align-items:center;gap:8px;font-weight:600;margin:0 0 6px}
.fb-ok{color:var(--good)}
.fb-head{color:var(--bad)}
.fb-head.neutral{color:var(--ink)}
.fb-list{display:grid;gap:4px;margin:0 0 4px}
.fb-list li{display:flex;gap:8px;align-items:flex-start;background:var(--bad-soft);border:1px solid var(--bad);border-radius:4px;padding:6px 10px}
.fb-list .icon{color:var(--bad);margin-top:5px}
.explain{white-space:pre-line;margin-top:6px}
.play-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.end{text-align:center;padding:20px 14px}
.end-stars{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-size:20px;color:var(--ink);margin:8px 0}
.end .play-actions{justify-content:center}
.vp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* status marks: icon + text */
.vp-status{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.vp-status.ok{color:var(--good)}
.vp-status.bad{color:var(--bad)}
.vp-status.warn{color:var(--coin-ink)}
input.is-ok,select.is-ok,.vc-item.is-ok,.jl.is-ok{border-color:var(--good)!important;background-color:var(--good-soft)}
input.is-bad,select.is-bad,.vc-item.is-bad,.jl.is-bad{border-color:var(--bad)!important;background-color:var(--bad-soft)}
input.is-warn{border-color:var(--coin-ink)!important}

/* inputs */
.vj input,.vj select,.vt input,.vt select,.vcalc input{font-family:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1.5px solid var(--edge);border-radius:4px;padding:6px 8px;min-height:var(--tap);width:100%}
.vj input.num,.vt input.num,.vcalc input.num{font-family:var(--f-mono);text-align:right}
.vj input:focus-visible,.vj select:focus-visible,.vt input:focus-visible,.vt select:focus-visible,.vcalc input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vj input:disabled,.vj select:disabled,.vt input:disabled,.vt select:disabled,.vcalc input:disabled{opacity:1;color:var(--ink)}

/* journal */
.vj-count{margin:0 0 8px}
.jentry{border:1px solid var(--line);border-radius:5px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.jentry:focus{outline:none}
.jentry-h{font-size:15px;margin:0 0 6px}
.jl-head{display:none}
.jl{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.jl-top{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.jl-acct{flex:1;min-width:0}
.jl-dr,.jl-cr{display:flex;flex-direction:column;gap:2px;min-width:0}
.jl-lab{font-size:12.5px;color:var(--muted)}
.jl-mark{grid-column:1/-1}
.jl-rm{flex:none}
.jentry-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vj-total{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;flex:1 1 200px}
.vj-total.bal{color:var(--good);font-weight:600}
.vj-total.unbal{color:var(--bad);font-weight:600}
.vj-foot{margin-top:4px}
@media (min-width:640px){
  .jl-head{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px 84px;gap:8px;font-size:13px;color:var(--muted);padding:0 8px 4px}
  .jl{grid-template-columns:minmax(0,1fr) 130px 130px 84px;align-items:center}
  .jl-top{display:contents}
  .jl-acct{grid-column:1}
  .jl-dr{grid-column:2}
  .jl-cr{grid-column:3}
  .jl-rm{grid-column:4;grid-row:1}
  .jl-lab{display:none}
}

/* table */
.vt-wrap{overflow-x:auto;max-width:100%}
.vt-wrap:focus-visible{outline:2px solid var(--accent)}
.vt{border-collapse:collapse;width:100%;min-width:max-content}
.vt th,.vt td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.vt thead th{background:var(--panel2);font-family:var(--f-display);font-weight:500;font-size:14px;text-align:center}
.vt .vt-first{text-align:left;min-width:150px;font-weight:500}
.vt tbody th.vt-first{background:var(--panel2)}
.vt-cell{min-width:120px}
.vt-given{display:block;text-align:right;padding:6px 2px}
.vt-empty{background:var(--panel2)}
.vt-mark{margin-top:2px}

/* classify */
.vc-items{display:grid;gap:8px;margin:0 0 12px}
.vc-item{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--edge);border-radius:5px;padding:8px 12px;min-height:var(--tap);cursor:pointer}
.vc-item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),inset 4px 0 0 var(--accent)}
.vc-item:disabled{cursor:default;color:var(--ink)}
.vc-chip{font-size:13px;color:var(--muted)}
.vc-chip.set{color:var(--ink);font-weight:600}
.vc-mark{display:block;margin:2px 0 0 4px}
.vc-cats{display:flex;flex-wrap:wrap;gap:8px}

/* calc */
.vcalc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vcalc-row input{width:min(240px,100%)}
.vcalc-mark{margin-top:6px}
.vt-sub{font-size:12px;color:var(--muted,inherit);margin-bottom:2px}
.vt-hint{font-size:13px;margin:6px 4px 0}
.vt-sub{font-size:12px;margin-bottom:2px}
.vt-hint{font-size:13px;margin:6px 4px 0}

/* coarse-pointer input size must win over the play-view base rule above */
@media (pointer:coarse){.vj input,.vj select,.vt input,.vt select,.vcalc input,input,select,textarea{font-size:16px}}

</style>
</head>

<script>
"use strict";
// mulberry32 seeded PRNG
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randInt(rng, lo, hi) {
  return lo + Math.floor(rng() * (hi - lo + 1));
}

function pick(rng, arr) {
  return arr[Math.floor(rng() * arr.length)];
}

function shuffle(rng, arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function roundTo(x, step) {
  return Math.round(x / step) * step;
}


const THAI_DIGITS = '๐๑๒๓๔๕๖๗๘๙';

function parseMoney(s) {
  if (typeof s !== 'string') return null;
  let cleaned = s.trim();
  let neg = false;
  const paren = /^\((.*)\)$/.exec(cleaned);
  if (paren) { neg = true; cleaned = paren[1]; }
  cleaned = cleaned
    .replace(/[−–—]/g, '-')
    .replace(/[๐-๙]/g, (d) => String(THAI_DIGITS.indexOf(d)))
    .replace(/[\s,]/g, '');
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(cleaned)) return null;
  const n = Number(cleaned);
  return neg ? (n === 0 ? 0 : -Math.abs(n)) : n;
}

function formatMoney(n, dp = 0) {
  return n.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

function moneyEq(a, b, tol = 0.005) {
  return Math.abs(a - b) < tol;
}


const ACCT_ROWS = [
  ['cash', '101', 'เงินสด', 'Cash'],
  ['ar', '102', 'ลูกหนี้การค้า', 'Accounts receivable'],
  ['inventory', '105', 'สินค้าคงเหลือ', 'Inventory'],
  ['ap', '201', 'เจ้าหนี้การค้า', 'Accounts payable'],
  ['sales', '401', 'ขาย', 'Sales revenue'],
  ['salesReturns', '401.1', 'รับคืนและส่วนลดจ่าย', 'Sales returns and allowances'],
  ['salesDiscounts', '401.2', 'ส่วนลดจ่าย', 'Sales discounts'],
  ['cogs', '501', 'ต้นทุนขาย', 'Cost of goods sold'],
  ['freightOut', '502', 'ค่าขนส่งออก', 'Freight-out'],
  ['incomeSummary', '', 'สรุปผลกำไรขาดทุน', 'Income summary'],
  ['capital', '', 'ทุน', 'Capital'],
  ['drawings', '', 'ถอนใช้ส่วนตัว', 'Drawings'],
  ['opex', '', 'ค่าใช้จ่ายในการดำเนินงาน', 'Operating expenses'],
  ['purchases', '', 'ซื้อ', 'Purchases'],
  ['purchaseReturns', '', 'ส่งคืนสินค้า', 'Purchase returns'],
  ['purchaseDiscounts', '', 'ส่วนลดรับ', 'Purchase discounts'],
  ['freightIn', '', 'ค่าขนส่งเข้า', 'Freight-in'],
  ['inputVat', '', 'ภาษีซื้อ', 'Input VAT'],
  ['outputVat', '', 'ภาษีขาย', 'Output VAT'],
  ['suspInputVat', '', 'ภาษีซื้อยังไม่ถึงกำหนด', 'Suspended input VAT'],
  ['suspOutputVat', '', 'ภาษีขายยังไม่ถึงกำหนด', 'Suspended output VAT'],
  ['vatPayable', '', 'ภาษีมูลค่าเพิ่มค้างจ่าย', 'VAT payable'],
  ['vatReceivable', '', 'ลูกหนี้กรมสรรพากร', 'VAT receivable'],
  ['serviceExpense', '', 'ค่าบริการ', 'Service expense'],
  ['serviceRevenue', '', 'รายได้ค่าบริการ', 'Service revenue'],
  ['promoExpense', '', 'ค่าส่งเสริมการขาย', 'Promotion expense'],
  ['rawMaterials', '', 'วัตถุดิบ', 'Raw materials control'],
  ['factoryLabor', '', 'ค่าแรงงานโรงงาน', 'Factory labor control'],
  ['moh', '', 'ค่าใช้จ่ายการผลิต', 'Manufacturing overhead control'],
  ['wip', '', 'งานระหว่างทำ', 'Work in process'],
  ['fg', '', 'สินค้าสำเร็จรูป', 'Finished goods'],
  ['wagesPayable', '', 'ค่าแรงค้างจ่าย', 'Wages payable'],
  ['accumDep', '', 'ค่าเสื่อมราคาสะสม', 'Accumulated depreciation'],
];

const ACCOUNTS = Object.fromEntries(
  ACCT_ROWS.map(([id, code, th, en]) => [id, code ? { id, code, th, en } : { id, th, en }])
);

function acctLabel(id) {
  const a = ACCOUNTS[id];
  return a ? a.th + ' (' + a.en + ')' : String(id);
}



const JOURNAL_TOL = 0.5;

function netByAccount(entries) {
  const m = new Map();
  for (const entry of entries) {
    for (const l of entry) {
      if (!l || !l.acct) continue;
      m.set(l.acct, (m.get(l.acct) || 0) + (l.dr || 0) - (l.cr || 0));
    }
  }
  return m;
}

function isBalanced(lines) {
  let d = 0;
  let c = 0;
  for (const l of lines) {
    d += l.dr || 0;
    c += l.cr || 0;
  }
  return moneyEq(d, c);
}

function journalSign(x) {
  return Math.abs(x) < JOURNAL_TOL ? 0 : x > 0 ? 1 : -1;
}

function gradeJournal(problem, answer) {
  const clean = answer
    .map((entry) => entry.filter((l) => l && l.acct && ((l.dr || 0) !== 0 || (l.cr || 0) !== 0)))
    .filter((entry) => entry.length > 0);
  const generic = [];
  if (clean.some((entry) => !isBalanced(entry))) {
    generic.push({ code: 'unbalanced', msg: 'รายการบัญชีบางรายการเดบิตไม่เท่ากับเครดิต' });
  }
  const exp = netByAccount(problem.entries);
  const got = netByAccount(clean);
  const ids = new Set([...exp.keys(), ...got.keys()]);
  for (const acct of ids) {
    const label = acctLabel(acct);
    if (!got.has(acct)) {
      generic.push({ code: 'missing-line', acct, msg: 'ขาดบรรทัดบัญชี ' + label });
    } else if (!exp.has(acct)) {
      generic.push({ code: 'extra-line', acct, msg: 'มีบรรทัดบัญชีที่ไม่ควรมี ' + label });
    } else {
      const e = exp.get(acct);
      const g = got.get(acct);
      if (journalSign(e) !== journalSign(g) && journalSign(e) !== 0 && journalSign(g) !== 0) {
        generic.push({ code: 'wrong-side', acct, msg: 'ด้านเดบิต/เครดิตผิด ที่บัญชี ' + label });
      } else if (!moneyEq(Math.abs(e), Math.abs(g), JOURNAL_TOL)) {
        generic.push({ code: 'wrong-amount', acct, msg: 'จำนวนเงินไม่ถูกต้อง ที่บัญชี ' + label });
      }
    }
  }
  // Same account on both Dr and Cr lines, not expected at all: flag even if it nets to 0.
  const seenDr = new Set();
  const seenCr = new Set();
  for (const entry of clean) {
    for (const l of entry) {
      if ((l.dr || 0) > 0) seenDr.add(l.acct);
      if ((l.cr || 0) > 0) seenCr.add(l.acct);
    }
  }
  for (const acct of seenDr) {
    if (seenCr.has(acct) && !exp.has(acct) && !generic.some((i) => i.acct === acct)) {
      generic.push({
        code: 'extra-line',
        acct,
        msg: 'มีบรรทัดบัญชีที่ไม่ควรมี ' + acctLabel(acct) + ' (ทั้งเดบิตและเครดิต)',
      });
    }
  }
  const specific = problem.diagnose ? problem.diagnose(got) || [] : [];
  const seen = new Set(specific.filter((i) => i.acct).map((i) => i.acct));
  const issues = [...specific, ...generic.filter((i) => !i.acct || !seen.has(i.acct))];
  return { ok: issues.length === 0, issues };
}



const DEFAULT_TOL = 0.5;

function gradeTable(problem, answer) {
  const cells = {};
  const issues = [];
  for (const row of problem.rows || []) {
    for (const cell of row.cells) {
      if (cell.given) continue;
      const raw = answer[cell.key];
      const n = typeof raw === 'string' ? parseMoney(raw) : null;
      if (typeof raw !== 'string' || raw.trim() === '') {
        cells[cell.key] = 'blank';
        issues.push({ code: 'cell-blank', cell: cell.key, msg: 'ยังไม่ได้กรอกช่อง ' + row.label });
      } else if (n === null || !(Math.abs(n - cell.value) <= (cell.tol ?? DEFAULT_TOL) + 1e-9)) {
        cells[cell.key] = 'wrong';
        issues.push({ code: 'cell-wrong', cell: cell.key, msg: 'ตัวเลขในช่อง ' + row.label + ' ไม่ถูกต้อง' });
      } else {
        cells[cell.key] = 'ok';
      }
    }
  }
  return { ok: issues.length === 0, issues, cells };
}

function gradeClassify(problem, answer) {
  const items = problem.items.map((it, i) => answer[i] === it.answer);
  const issues = [];
  items.forEach((good, i) => {
    if (!good) issues.push({ code: 'class-wrong', msg: 'จัดหมวดผิด: ' + problem.items[i].text });
  });
  return { ok: issues.length === 0, issues, items };
}

function gradeCalc(problem, answer) {
  const n = parseMoney(answer);
  const tol = problem.tol ?? DEFAULT_TOL;
  if (n === null || !(Math.abs(n - problem.answer) <= tol + 1e-9)) {
    return { ok: false, issues: [{ code: 'calc-wrong', msg: 'คำตอบไม่ถูกต้อง' }] };
  }
  return { ok: true, issues: [] };
}


const MISS_WRONG = 1;
const MISS_REVEAL = 2;

const SHOP_STAGES = [
  { min: 0, th: 'แผงตลาด' },
  { min: 20, th: 'ร้านค้า' },
  { min: 40, th: 'ร้านจด VAT' },
  { min: 60, th: 'โรงงาน' },
  { min: 80, th: 'บริษัทขอกู้ธนาคาร' },
];

function starsFor(missPoints) {
  return missPoints <= 0 ? 3 : missPoints === 1 ? 2 : 1;
}

function shopStage(totalStars) {
  let index = 0;
  for (let i = 0; i < SHOP_STAGES.length; i++) {
    if (totalStars >= SHOP_STAGES[i].min) index = i;
  }
  const nextStage = SHOP_STAGES[index + 1];
  return { index, th: SHOP_STAGES[index].th, next: nextStage ? nextStage.min : null };
}

function topMistakes(tally, n = 5) {
  return Object.entries(tally)
    .filter(([, c]) => c > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n);
}



const STORAGE_KEY = 'acct2601115.v1';

const DEFAULT_STATE = {
  v: 1,
  best: {},
  mistakes: {},
  settings: { showEntryCount: false },
};

function cloneDefault() {
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function isPlainObject(x) {
  return x !== null && typeof x === 'object' && !Array.isArray(x);
}

function loadState(storage) {
  try {
    const raw = storage.getItem(STORAGE_KEY);
    if (raw === null || raw === undefined) return cloneDefault();
    const s = JSON.parse(raw);
    if (!isPlainObject(s) || s.v !== 1) return cloneDefault();
    if (!isPlainObject(s.best) || !isPlainObject(s.mistakes)) return cloneDefault();
    if (s.settings !== undefined && !isPlainObject(s.settings)) return cloneDefault();
    const d = cloneDefault();
    return {
      v: 1,
      best: { ...s.best },
      mistakes: { ...s.mistakes },
      settings: { ...d.settings, ...(s.settings || {}) },
    };
  } catch (e) {
    return cloneDefault();
  }
}

function saveState(storage, state) {
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // storage unavailable: game stays playable without persistence
  }
}

function recordMistake(state, code) {
  return { ...state, mistakes: { ...state.mistakes, [code]: (state.mistakes[code] || 0) + 1 } };
}

function finishRound(state, subtopicId, missPoints) {
  const stars = starsFor(missPoints);
  const old = state.best[subtopicId] || 0;
  return { ...state, best: { ...state.best, [subtopicId]: Math.max(old, stars) } };
}

function totalStars(state) {
  return Object.values(state.best).reduce((a, b) => a + b, 0);
}

function ch1_explain(entries, reason) {
  const blocks = entries.map((entry, i) => {
    const dr = entry.filter((l) => l.dr > 0).map((l) => 'Dr ' + ch1_name(l.acct) + ' ' + ch1_m(l.dr));
    const cr = entry.filter((l) => l.cr > 0).map((l) => '    Cr ' + ch1_name(l.acct) + ' ' + ch1_m(l.cr));
    return (entries.length > 1 ? '(' + (i + 1) + ') ' : '') + [...dr, ...cr].join('\n');
  });
  return blocks.join('\n') + '\nเหตุผล: ' + reason;

// ---- diagnoses ----
function ch1_amt(got, acct) {
  return got.get(acct) || 0;
}
function ch1_diagPeriodic(got) {
  return ch1_DECOYS.filter((a) => got.has(a)).map((a) => ({
    code: 'ch1.periodic-account',
    acct: a,
    msg: 'ใช้บัญชี ' + ch1_name(a) + ' ซึ่งเป็นของระบบ Periodic — ' + MISTAKE_LABELS_CH1['ch1.periodic-account'],
  }));
}
function ch1_diagForgotCogs(got) {
  if (Math.abs(ch1_amt(got, 'cogs')) >= 0.5) return [];
  return [{ code: 'ch1.sale.forgot-cogs', acct: 'cogs', msg: MISTAKE_LABELS_CH1['ch1.sale.forgot-cogs'] }];
}
function ch1_diagForgotInventory(got) {
  if (Math.abs(ch1_amt(got, 'inventory')) >= 0.5) return [];
  return [{ code: 'ch1.sreturn.forgot-inventory', acct: 'inventory', msg: MISTAKE_LABELS_CH1['ch1.sreturn.forgot-inventory'] }];
}
// gross = undiscounted amount; sign = +1 cash received (Dr), -1 cash paid (Cr)
function ch1_diagNotDeducted(gross, sign) {
  return (got) => {
    if (Math.abs(ch1_amt(got, 'cash') - sign * gross) >= 0.5) return [];
    return [{ code: 'ch1.disc.not-deducted', acct: 'cash', msg: MISTAKE_LABELS_CH1['ch1.disc.not-deducted'] }];
  };
}
function ch1_diag(...extra) {
  return (got) => [...ch1_diagPeriodic(got), ...extra.flatMap((f) => f(got))];
}

function ch1_journal(topicId, title, rng, text, entries, reason, extraDiag, accts) {
  return {
    topicId,
    mode: 'journal',
    title,
    text,
    explain: ch1_explain(entries, reason),
    accounts: ch1_accounts(rng, accts),
    entries,
    diagnose: ch1_diag(...(extraDiag || [])),
  };
}

  const rng = ch1_rngFor(params);

  const terms = ch1_termsFor(rate);
  const buyDay = params.buyDay || 2;

  const text = ch1_date(buyDay) + ' ซื้อสินค้าเป็นเงินเชื่อ ' + ch1_m(ap) + ' บาท เงื่อนไข ' + terms +

function ch1_sReturnFrom(params) {

  const { price, cost, credit } = params;
  const day = params.day || 14;
  const text = ch1_date(day) + ' ลูกค้าส่งคืนสินค้าที่ซื้อไป ราคาขาย ' + ch1_m(price) + ' บาท (ต้นทุน ' + ch1_m(cost) +
    ' บาท) สินค้าอยู่ในสภาพดี นำกลับเข้าสต๊อก ' +
    (credit ? '(ขายเป็นเงินเชื่อและลูกค้ายังไม่ได้ชำระ จึงลดหนี้ให้)' : '(ขายเป็นเงินสด จึงคืนเงินสดให้ลูกค้า)') +
    '\nให้บันทึกรายการรับคืนสินค้า (ระบบ Perpetual)';
  const cr = credit ? 'ar' : 'cash';
  const entries = [
    [ch1_L('salesReturns', price, 0), ch1_L(cr, 0, price)],
    [ch1_L('inventory', cost, 0), ch1_L('cogs', 0, cost)],
  ];
  return ch1_journal('ch1.sreturn', 'รับคืนสินค้า', rng, text, entries,
    'รับคืนตามราคาขายเดบิตรับคืนและส่วนลดจ่าย และนำสินค้ากลับเข้าสต๊อกตามราคาทุน (Dr สินค้าคงเหลือ / Cr ต้นทุนขาย)', [ch1_diagForgotInventory]);
}

// ---- 8. receive within discount period ----
function ch1_recvDiscFrom(params) {
  const rng = ch1_rngFor(params);
  const { ar, rate } = params;
  const within = params.within !== false;
  const terms = ch1_termsFor(rate);
  const saleDay = params.saleDay || 5;
  const recvDay = params.recvDay || (within ? saleDay + 9 : saleDay + 17);
  const text = ch1_date(saleDay) + ' ขายสินค้าเป็นเงินเชื่อ ' + ch1_m(ar) + ' บาท เงื่อนไข ' + terms +
    ' (บันทึกการขายและต้นทุนขายแล้ว)\n' + ch1_date(recvDay) + ' ได้รับชำระหนี้ทั้งจำนวน — ' +
    (within ? 'อยู่ภายในกำหนดส่วนลด (ภายใน 10 วัน)' : 'เกินกำหนดส่วนลดแล้ว (เกิน 10 วัน)') +
    '\nให้บันทึกรายการรับชำระหนี้';
  let entries;
  let reason;
  if (within) {
    const disc = Math.round(ar * rate);
    entries = [[ch1_L('cash', ar - disc, 0), ch1_L('salesDiscounts', disc, 0), ch1_L('ar', 0, ar)]];
    reason = 'ลูกค้าชำระภายในกำหนดได้ส่วนลด ' + ch1_m(ar) + ' × ' + Math.round(rate * 100) + '% = ' + ch1_m(disc) +
      ' บันทึกเป็นส่วนลดจ่าย (Sales discounts) รับเงินสด ' + ch1_m(ar - disc);
  } else {
    entries = [[ch1_L('cash', ar, 0), ch1_L('ar', 0, ar)]];
    reason = 'ชำระเกินกำหนดส่วนลดจึงไม่มีส่วนลด รับเงินเต็มจำนวน';
  }
  const extra = within ? [ch1_diagNotDeducted(ar, 1)] : [];
  return ch1_journal('ch1.recvdisc', 'รับชำระหนี้ (ส่วนลดเงินสด)', rng, text, entries, reason, extra);
}

// ---- 9. shrinkage ----
function ch1_shrinkFrom(params) {
  const rng = ch1_rngFor(params);
  const { book, count } = params;
  const diff = book - count;
  const text = '30 ก.ย. 25x3 (สิ้นงวด) ยอดสินค้าคงเหลือตามบัญชี ' + ch1_m(book) + ' บาท ตรวจนับจริงได้ ' + ch1_m(count) +
    ' บาท\nให้บันทึกรายการปรับปรุงสินค้าขาดหาย (ระบบ Perpetual)';
  const entries = [[ch1_L('cogs', diff, 0), ch1_L('inventory', 0, diff)]];
  return ch1_journal('ch1.shrink', 'ปรับปรุงสินค้าขาดหาย', rng, text, entries,
    'สินค้าขาดหาย ' + ch1_m(book) + ' − ' + ch1_m(count) + ' = ' + ch1_m(diff) + ' ปรับลดสินค้าคงเหลือให้เท่ายอดนับจริง และรับรู้เป็นต้นทุนขาย');
}

// ---- 10. closing entries ----
const ch1_CLOSE_DR = ['salesReturns', 'salesDiscounts', 'cogs', 'freightOut', 'opex'];
// Capital is the plug that makes the adjusted trial balance balance (total Dr = total Cr).
function ch1_closingPerm(b) {
  return { cash: b.cash ?? 85000, ar: b.ar ?? 42000, inventory: b.inventory ?? 56000, ap: b.ap ?? 38000 };
}
function ch1_closingCapital(b) {
  const p = ch1_closingPerm(b);
  const nominalDr = ch1_CLOSE_DR.reduce((s, k) => s + b[k], 0);
  return p.cash + p.ar + p.inventory + b.drawings + nominalDr - p.ap - b.sales;
}
function ch1_closingFrom(params) {
  const rng = ch1_rngFor(params);
  const b = params;
  const shop = params.shop || ch1_SHOPS[0];
  const totalDr = ch1_CLOSE_DR.reduce((s, k) => s + b[k], 0);
  const profit = b.sales - totalDr;
  const perm = ch1_closingPerm(b);
  const capital = ch1_closingCapital(b);
  const others = [
    ['cash', perm.cash, 'Dr'], ['ar', perm.ar, 'Dr'], ['inventory', perm.inventory, 'Dr'],
    ['ap', perm.ap, 'Cr'], ['capital', capital, 'Cr'], ['drawings', b.drawings, 'Dr'],
  ];
  const nominal = [['sales', b.sales, 'Cr'], ...ch1_CLOSE_DR.map((k) => [k, b[k], 'Dr'])];
  const lines = [...others, ...nominal].map(([k, v, side]) => '  ' + ch1_name(k) + ' ' + ch1_m(v) + ' (' + side + ')');
  const text = shop + ' (ระบบ Perpetual) มียอดคงเหลือในงบทดลองหลังปรับปรุง ณ 30 ก.ย. 25x3 ดังนี้\n' + lines.join('\n') +
    '\nให้บันทึกรายการปิดบัญชีทั้ง 4 ขั้น (ปิดรายได้ → ปิดค่าใช้จ่าย/บัญชีหักรายได้ → ปิดสรุปผลกำไรขาดทุน → ปิดถอนใช้ส่วนตัว)';
  const e3 = profit >= 0
    ? [ch1_L('incomeSummary', profit, 0), ch1_L('capital', 0, profit)]
    : [ch1_L('capital', -profit, 0), ch1_L('incomeSummary', 0, -profit)];
  const entries = [
    [ch1_L('sales', b.sales, 0), ch1_L('incomeSummary', 0, b.sales)],
    [ch1_L('incomeSummary', totalDr, 0), ...ch1_CLOSE_DR.map((k) => ch1_L(k, 0, b[k]))],
    e3,
    [ch1_L('capital', b.drawings, 0), ch1_L('drawings', 0, b.drawings)],
  ];
  const reason = 'ปิดบัญชีชั่วคราวเข้าสรุปผลกำไรขาดทุน: ' +
    (profit >= 0 ? 'กำไรสุทธิ ' + ch1_m(profit) + ' โอนเข้าทุน (Dr สรุปผล / Cr ทุน)' : 'ขาดทุนสุทธิ ' + ch1_m(-profit) + ' โอนลดทุน (Dr ทุน / Cr สรุปผล)') +
    ' แล้วปิดถอนใช้ส่วนตัวเข้าทุน บัญชีสินทรัพย์/หนี้สินไม่ต้องปิด';
  return ch1_journal('ch1.closing', 'รายการปิดบัญชี', rng, text, entries, reason, [], ch1_CLOSING_ACCTS);
}

// ---- 11. multi-step income statement ----
const ch1_MS_ROWS = [
  ['sales', 'ขาย', true],
  ['salesReturns', 'หัก รับคืนและส่วนลดจ่าย', true],
  ['salesDiscounts', 'หัก ส่วนลดจ่าย', true],
  ['netSales', 'ขายสุทธิ', false],
  ['cogs', 'หัก ต้นทุนขาย', true],
  ['grossProfit', 'กำไรขั้นต้น', false],
  ['freightOut', 'ค่าใช้จ่ายในการขาย: ค่าขนส่งออก', true],
  ['salespersonSalary', 'ค่าใช้จ่ายในการขาย: เงินเดือนพนักงานขาย', true],
  ['advertising', 'ค่าใช้จ่ายในการขาย: ค่าโฆษณา', true],
  ['totalSelling', 'รวมค่าใช้จ่ายในการขาย', false],
  ['rent', 'ค่าใช้จ่ายในการบริหาร: ค่าเช่าสำนักงาน', true],
  ['adminSalary', 'ค่าใช้จ่ายในการบริหาร: เงินเดือนฝ่ายบริหาร', true],
  ['totalAdmin', 'รวมค่าใช้จ่ายในการบริหาร', false],
  ['totalOpex', 'รวมค่าใช้จ่ายในการดำเนินงาน', false],
  ['operatingProfit', 'กำไรจากการดำเนินงาน', false],
  ['interestIncome', 'บวก รายได้อื่น: รายได้ดอกเบี้ย', true],
  ['interestExpense', 'หัก ค่าใช้จ่ายอื่น: ค่าใช้จ่ายดอกเบี้ย', true],
  ['profitBeforeTax', 'กำไรก่อนภาษีเงินได้', false],
  ['tax', 'ภาษีเงินได้ (20% ของกำไรก่อนภาษี)', false],
  ['netIncome', 'กำไรสุทธิ', false],
];
function ch1_msCompute(b) {
  const v = { ...b };
  v.netSales = b.sales - b.salesReturns - b.salesDiscounts;
  v.grossProfit = v.netSales - b.cogs;
  v.totalSelling = b.freightOut + b.salespersonSalary + b.advertising;
  v.totalAdmin = b.rent + b.adminSalary;
  v.totalOpex = v.totalSelling + v.totalAdmin;
  v.operatingProfit = v.grossProfit - v.totalOpex;
  v.profitBeforeTax = v.operatingProfit + b.interestIncome - b.interestExpense;
  v.tax = Math.round(v.profitBeforeTax * 0.2);
  v.netIncome = v.profitBeforeTax - v.tax;
  return v;
}
function ch1_multistepFrom(params) {
  const v = ch1_msCompute(params);
  const shop = params.shop || ch1_SHOPS[0];
  const given = ch1_MS_ROWS.filter((r) => r[2]).map(([k, label]) => '  ' + label.replace(/^(หัก |บวก )/, '') + ' ' + ch1_m(v[k]));
  const text = shop + ' (ระบบ Perpetual) มีข้อมูลสำหรับงวดสิ้นสุด 30 ก.ย. 25x3 ดังนี้\n' + given.join('\n') +
    '\nอัตราภาษีเงินได้ 20% ของกำไรก่อนภาษี\nให้จัดทำงบกำไรขาดทุนแบบหลายขั้น (Multi-step) โดยกรอกช่องที่ว่าง';
  const rows = ch1_MS_ROWS.map(([key, label, isGiven]) => ({ label, cells: [{ key, value: v[key], given: isGiven }] }));
  const explain = [
    'ขายสุทธิ = ' + ch1_m(v.sales) + ' − ' + ch1_m(v.salesReturns) + ' − ' + ch1_m(v.salesDiscounts) + ' = ' + ch1_m(v.netSales),
    'กำไรขั้นต้น = ' + ch1_m(v.netSales) + ' − ' + ch1_m(v.cogs) + ' = ' + ch1_m(v.grossProfit),
    'ค่าใช้จ่ายในการขาย = ' + ch1_m(v.freightOut) + ' + ' + ch1_m(v.salespersonSalary) + ' + ' + ch1_m(v.advertising) + ' = ' + ch1_m(v.totalSelling),
    'ค่าใช้จ่ายในการบริหาร = ' + ch1_m(v.rent) + ' + ' + ch1_m(v.adminSalary) + ' = ' + ch1_m(v.totalAdmin),
    'รวมค่าใช้จ่ายในการดำเนินงาน = ' + ch1_m(v.totalOpex),
    'กำไรจากการดำเนินงาน = ' + ch1_m(v.grossProfit) + ' − ' + ch1_m(v.totalOpex) + ' = ' + ch1_m(v.operatingProfit),
    'กำไรก่อนภาษี = ' + ch1_m(v.operatingProfit) + ' + ' + ch1_m(v.interestIncome) + ' − ' + ch1_m(v.interestExpense) + ' = ' + ch1_m(v.profitBeforeTax),
    'ภาษี 20% = ' + ch1_m(v.tax) + ' → กำไรสุทธิ = ' + ch1_m(v.netIncome),
    'เหตุผล: ค่าขนส่งออกเป็นค่าใช้จ่ายในการขาย ดอกเบี้ยเป็นรายการอื่นนอกการดำเนินงาน',
  ].join('\n');
  return { topicId: 'ch1.multistep', mode: 'table', title: 'งบกำไรขาดทุนแบบหลายขั้น', text, explain,
    columns: ['รายการ', 'จำนวนเงิน (บาท)'], rows };
}

// ---- 12. mixed: 5 sequential transactions ----
function ch1_mixedSet(rng) {
  const shop = pick(rng, ch1_SHOPS);
  const goods = pick(rng, ch1_GOODS);
  const supplier = 'บริษัท ' + pick(rng, ['ไทยซัพพลาย', 'สยามค้าส่ง', 'รวมใจเทรดดิ้ง']) + ' จำกัด';
  const terms = pick(rng, ch1_TERMS);
  const rate = ch1_rate(terms);
  const d1 = randInt(rng, 1, 8);
  const gross = randInt(rng, 20, 100) * 500;
  const freight = randInt(rng, 3, 20) * 100;
  const returned = randInt(rng, 1, Math.floor((gross / 500) * 0.3)) * 500;
  const owed = gross - returned;
  const disc = Math.round(owed * rate);
  const dFr = d1 + 1;
  const dRet = d1 + 3;
  const dPay = d1 + randInt(rng, 5, 10);
  const dSale = dPay + randInt(rng, 1, 5);
  const cost = roundTo(owed * (randInt(rng, 40, 90) / 100), 100);
  const price = roundTo(cost * (randInt(rng, 125, 160) / 100), 100);
  const saleTerms = pick(rng, ch1_TERMS);
  const tx = [
    ch1_date(d1) + ' ซื้อ' + goods + 'จาก' + supplier + ' เป็นเงินเชื่อ ' + ch1_m(gross) + ' บาท เงื่อนไข ' + terms + ' FOB ต้นทาง',
    ch1_date(dFr) + ' จ่ายค่าขนส่งสินค้าที่ซื้อเมื่อ ' + ch1_date(d1) + ' เป็นเงินสด ' + ch1_m(freight) + ' บาท',
    ch1_date(dRet) + ' ส่งคืน' + goods + 'ชำรุดแก่' + supplier + ' ราคา ' + ch1_m(returned) + ' บาท',
    ch1_date(dPay) + ' จ่ายชำระหนี้ที่เหลือทั้งหมดแก่' + supplier + ' (ภายในกำหนดส่วนลด)',
    ch1_date(dSale) + ' ขาย' + goods + 'เป็นเงินเชื่อ ' + ch1_m(price) + ' บาท เงื่อนไข ' + saleTerms + ' ต้นทุนของสินค้าที่ขาย ' + ch1_m(cost) + ' บาท',
  ];
  const specs = [
    [[[ch1_L('inventory', gross, 0), ch1_L('ap', 0, gross)]], 'ซื้อเชื่อ: Perpetual เดบิตสินค้าคงเหลือ เครดิตเจ้าหนี้การค้า', []],
    [[[ch1_L('inventory', freight, 0), ch1_L('cash', 0, freight)]], 'FOB ต้นทาง ผู้ซื้อรับภาระค่าขนส่ง รวมเป็นต้นทุนสินค้าคงเหลือ', []],
    [[[ch1_L('ap', returned, 0), ch1_L('inventory', 0, returned)]], 'ส่งคืนสินค้า: ลดเจ้าหนี้และลดสินค้าคงเหลือ', []],
    [[[ch1_L('ap', owed, 0), ch1_L('cash', 0, owed - disc), ch1_L('inventory', 0, disc)]],
      'หนี้ที่เหลือหลังส่งคืน ' + ch1_m(gross) + ' − ' + ch1_m(returned) + ' = ' + ch1_m(owed) + ' ส่วนลด ' + Math.round(rate * 100) + '% = ' +
      ch1_m(disc) + ' ลดสินค้าคงเหลือ จ่ายเงินสด ' + ch1_m(owed - disc), [ch1_diagNotDeducted(owed, -1)]],
    [[[ch1_L('ar', price, 0), ch1_L('sales', 0, price)], [ch1_L('cogs', cost, 0), ch1_L('inventory', 0, cost)]],
      'ขายเชื่อ 2 รายการ: รายได้ตามราคาขาย และต้นทุนขายตามราคาทุน', [ch1_diagForgotCogs]],
  ];
  return specs.map(([entries, reason, extra], i) => {
    const lines = tx.slice(0, i + 1).map((t, j) => (j === i ? '▶ ' : '   ') + t);
    const text = shop + ' (ระบบ Perpetual) มีรายการค้าในเดือนกันยายน 25x3 ดังนี้\n' + lines.join('\n') +
      '\nให้บันทึกรายการที่ ' + (i + 1) + '/5 (บรรทัดที่มี ▶)';
    return ch1_journal('ch1.mixed', 'โจทย์ผสม รายการที่ ' + (i + 1) + '/5', rng, text, entries, reason, extra);
  });
}

}

// Chapter 2 — inventory costing (slides 24.08). Perpetual stock cards for FIFO / LIFO / moving average;
// weighted average is the periodic method (one average for the period), as in the slide example.
// Rounding: unit costs to 2 dp for display; totals rounded to baht from UNROUNDED running totals.

  'ch2.fifo-lifo-swapped': 'สลับวิธี FIFO กับ LIFO — FIFO ตัดต้นทุนชั้นที่ซื้อก่อน, LIFO ตัดชั้นที่ซื้อล่าสุด ณ วันที่ขาย',
  'ch2.avg-methods-mixed': 'สับสนถัวเฉลี่ยถ่วงน้ำหนัก (เฉลี่ยครั้งเดียวทั้งงวด) กับถัวเฉลี่ยเคลื่อนที่ (เฉลี่ยใหม่ทุกครั้งที่ซื้อ)',
  'ch2.unit-not-rounded': 'ต้นทุนต่อหน่วยต้องปัดทศนิยม 2 ตำแหน่ง ไม่ใช่ตัดหรือปัดเป็นจำนวนเต็ม',
  'ch2.simple-average': 'ใช้ค่าเฉลี่ยของราคาต่อหน่วยตรง ๆ — ต้องถ่วงด้วยจำนวนหน่วย (ต้นทุนรวม ÷ จำนวนหน่วยรวม)',
};

const ch2_RULE = 'ต้นทุนต่อหน่วยปัดทศนิยม 2 ตำแหน่ง ยอดรวมปัดเป็นบาท';
const ch2_LIFO_NOTE = 'IFRS ไม่อนุญาตให้ใช้ LIFO (ฝึกไว้เพราะมีในเนื้อหาวิชา)';
const ch2_METHODS = ['fifo', 'lifo', 'wavg', 'mavg'];
const ch2_METHOD_NAMES = {
  fifo: 'เข้าก่อนออกก่อน (FIFO)',
  lifo: 'เข้าหลังออกก่อน (LIFO)',
  wavg: 'ถัวเฉลี่ยถ่วงน้ำหนัก (Weighted average)',
  mavg: 'ถัวเฉลี่ยเคลื่อนที่ (Moving average)',
};
const ch2_SHOPS = ['ร้านสมใจ', 'ร้านรุ่งเรืองพาณิชย์', 'ร้านเจริญดี', 'ร้านมั่นคงการค้า', 'ร้านใจดีสโตร์', 'ร้านสุขสันต์'];
const ch2_GOODS = ['โทรทัศน์', 'ตู้เย็น', 'เครื่องซักผ้า', 'จักรยาน', 'โน้ตบุ๊ก', 'เครื่องปรับอากาศ', 'ไมโครเวฟ'];
const ch2_LOTS = ['A', 'B', 'C', 'D'];
const ch2_CARD_FIELDS = ['inQty', 'inUnit', 'inTotal', 'outQty', 'outTotal', 'balQty', 'balUnit', 'balTotal'];
const ch2_CARD_COLUMNS = ['วันที่', 'รับ: จำนวน', 'รับ: ราคา/หน่วย', 'รับ: รวม', 'จ่าย: จำนวน', 'จ่าย: รวม',
  'คงเหลือ: จำนวน', 'คงเหลือ: ราคา/หน่วย', 'คงเหลือ: รวม'];

function ch2_round(x, dp) {
  const f = 10 ** dp;
  return Math.round(x * f + 1e-6) / f;
}
function ch2_m(n) {
  return formatMoney(n);
}
function ch2_u(n) {
  return formatMoney(n, 2);
}
// show an exact amount: whole baht if it is whole, otherwise 2 dp
function ch2_mx(x) {
  const r = ch2_round(x, 2);
  return Number.isInteger(r) ? ch2_m(r) : ch2_u(r);
}
function ch2_date(day) {
  return day + ' ก.ย.';
}
function ch2_card(rule, pattern, example) {
  return '<p><b>หลัก:</b> ' + rule + '</p><p><b>รูปแบบ:</b><br>' + pattern + '</p><p><b>ตัวอย่าง:</b><br>' + example + '</p>';
}

// ---- cost flow engine ----
// events: {type:'buy', qty, unit, date?} | {type:'sell', qty, date?}. Throws if a sale exceeds units on hand.
function costFlow(method, events) {
  if (!ch2_METHODS.includes(method)) throw new Error('unknown method ' + method);
  const buys = events.filter((e) => e.type === 'buy');
  const unitsAvailable = buys.reduce((s, e) => s + e.qty, 0);
  const costAvailable = buys.reduce((s, e) => s + e.qty * e.unit, 0);
  const periodAvg = unitsAvailable > 0 ? costAvailable / unitsAvailable : 0;
  let layers = [];
  let qty = 0;
  let total = 0;
  const rows = events.map((ev) => {
    const row = { date: ev.date || '', inQty: null, inUnit: null, inTotal: null, outQty: null, outUnit: null, outTotal: null,
      balQty: 0, balUnit: null, balTotal: 0, outLayers: null, balLayers: null, balTotalExact: 0 };
    if (ev.type === 'buy') {
      row.inQty = ev.qty;
      row.inUnit = ev.unit;
      row.inTotal = ev.qty * ev.unit;
      qty += ev.qty;
      total += ev.qty * ev.unit;
      layers.push({ qty: ev.qty, unit: ev.unit });
    } else if (ev.type === 'sell') {
      if (ev.qty > qty) throw new Error('ขายเกินจำนวนคงเหลือ (sale of ' + ev.qty + ' exceeds ' + qty + ' on hand)');
      let out;
      if (method === 'fifo' || method === 'lifo') {
        const taken = [];
        let need = ev.qty;
        while (need > 0) {
          const layer = method === 'fifo' ? layers[0] : layers[layers.length - 1];
          const q = Math.min(need, layer.qty);
          taken.push({ qty: q, unit: layer.unit });
          layer.qty -= q;
          need -= q;
          if (layer.qty === 0) layers = method === 'fifo' ? layers.slice(1) : layers.slice(0, -1);
        }
        out = taken.reduce((s, l) => s + l.qty * l.unit, 0);
        row.outLayers = taken;
        row.outUnit = taken.length === 1 ? taken[0].unit : null;
      } else {
        const avg = method === 'mavg' ? total / qty : periodAvg;
        out = ev.qty * avg;
        row.outUnit = ch2_round(avg, 2);
      }
      row.outQty = ev.qty;
      row.outTotal = ch2_round(out, 0);
      qty -= ev.qty;
      total = qty === 0 ? 0 : total - out;
    } else {
      throw new Error('unknown event type ' + ev.type);
    }
    row.balQty = qty;
    row.balTotalExact = total;
    row.balTotal = ch2_round(total, 0);
    if (method === 'fifo' || method === 'lifo') {
      row.balLayers = layers.map((l) => ({ ...l }));
      row.balUnit = layers.length === 1 ? layers[0].unit : null;
    } else if (method === 'mavg') {
      row.balUnit = qty > 0 ? ch2_round(total / qty, 2) : 0;
    }
    return row;
  });
  const endValue = ch2_round(total, 0);
  const result = { cogs: costAvailable - endValue, endQty: qty, endValue, rows, unitsAvailable, costAvailable };
  if (method === 'wavg') result.unit = ch2_round(periodAvg, 2);
  if (method === 'mavg') result.unit = rows.length ? rows[rows.length - 1].balUnit : 0;
  return result;
}

// ---- event drawing ----
function ch2_reconciles(flow) {
  // the integer card adds up row by row, so summing a student's own rounded rows lands within tolerance
  return flow.rows.every((r, i) => i === 0 || r.balTotal === flow.rows[i - 1].balTotal + (r.inTotal || 0) - (r.outTotal || 0));
}
function ch2_drawEvents(rng) {
  for (;;) {
    const nBuy = randInt(rng, 2, 3);
    const nSell = randInt(rng, 1, 3);
    const kinds = shuffle(rng, [...Array(nBuy).fill('buy'), ...Array(nSell).fill('sell')]);
    let unit = randInt(rng, 10, 150) * 100;
    const events = [{ type: 'buy', qty: randInt(rng, 2, 20), unit }];
    let onHand = events[0].qty;
    let ok = true;
    for (const k of kinds) {
      if (k === 'buy') {
        unit = Math.min(20000, Math.max(1000, unit + (randInt(rng, -3, 10) || 5) * 100));
        const q = randInt(rng, 2, 20);
        events.push({ type: 'buy', qty: q, unit });
        onHand += q;
      } else {
        if (onHand < 3) { ok = false; break; }
        const q = randInt(rng, 2, Math.min(20, onHand - 1));
        events.push({ type: 'sell', qty: q });
        onHand -= q;
      }
    }
    if (!ok || !ch2_reconciles(costFlow('mavg', events))) continue;
    let day = 1;
    return events.map((e, i) => {
      if (i > 0) day += randInt(rng, 2, 4);
      return { ...e, day };
    });
  }
}
function ch2_withDays(events) {
  return events.map((e, i) => ({ ...e, day: e.day || 1 + 4 * i, date: ch2_date(e.day || 1 + 4 * i) }));
}
function ch2_setting(params) {
  const rng = params.rng || makeRng(7);
  return { shop: params.shop || pick(rng, ch2_SHOPS), goods: params.goods || pick(rng, ch2_GOODS) };
}
function ch2_eventLines(events) {
  return events.map((e, i) => {
    if (i === 0) return '  ' + e.date + ' ยอดยกมา ' + e.qty + ' หน่วย ราคาทุนหน่วยละ ' + ch2_m(e.unit) + ' บาท';
    if (e.type === 'buy') return '  ' + e.date + ' ซื้อ ' + e.qty + ' หน่วย หน่วยละ ' + ch2_m(e.unit) + ' บาท';
    return '  ' + e.date + ' ขาย ' + e.qty + ' หน่วย';
  }).join('\n');
}
function ch2_intro(set, events, system) {
  return set.shop + (system ? ' (' + system + ')' : '') + ' มีข้อมูล' + set.goods + ' ในเดือนกันยายน 25x3 ดังนี้\n' + ch2_eventLines(events);
}
function ch2_eventLabel(e, i) {
  return e.date + (i === 0 ? ' ยอดยกมา' : e.type === 'buy' ? ' ซื้อ' : ' ขาย');
}
function ch2_layers(list) {
  if (!list || list.length === 0) return '0';
  return list.map((l) => l.qty + ' × ' + ch2_m(l.unit)).join(' + ');
}

// ---- diagnoses (table answers) ----
function ch2_num(answers, key) {
  const raw = answers[key];
  return typeof raw === 'string' ? parseMoney(raw) : null;
}
// checks: [key, correct, other, code, tol]; flags when the answer is wrong but equals the other method's value
function ch2_diagOther(answers, checks) {
  const issues = [];
  for (const [key, correct, other, code, tol] of checks) {
    const n = ch2_num(answers, key);
    if (n === null || Math.abs(n - correct) <= tol || Math.abs(other - correct) <= tol) continue;
    if (Math.abs(n - other) <= tol) issues.push({ code, cell: key, msg: MISTAKE_LABELS_CH2[code] });
  }
  return issues;
}
function ch2_diagRounding(answers, unitCells) {
  const issues = [];
  for (const [key, v] of unitCells) {
    const n = ch2_num(answers, key);
    if (n === null || Number.isInteger(v) || Math.abs(n - v) <= 0.01) continue;
    if (n === Math.floor(v) || n === Math.round(v)) issues.push({ code: 'ch2.unit-not-rounded', cell: key, msg: MISTAKE_LABELS_CH2['ch2.unit-not-rounded'] });
  }
  return issues;
}

// ---- 1. specific identification ----
function ch2_specificFrom(params) {
  const set = ch2_setting(params);
  const { lots, sold } = params;
  const ask = params.ask || 'cogs';
  const cogs = lots.reduce((s, l, i) => s + sold[i] * l.unit, 0);
  const end = lots.reduce((s, l, i) => s + (l.qty - sold[i]) * l.unit, 0);
  const lotLines = lots.map((l, i) => '  ล็อต ' + ch2_LOTS[i] + ': ' + l.qty + ' หน่วย ราคาทุนหน่วยละ ' + ch2_m(l.unit) + ' บาท').join('\n');
  const soldList = lots.map((l, i) => (sold[i] > 0 ? 'ล็อต ' + ch2_LOTS[i] + ' ' + sold[i] + ' หน่วย' : null)).filter(Boolean).join(', ');
  const text = set.shop + ' ขาย' + set.goods + ' และใช้วิธีราคาเจาะจง (Specific identification) ระบุได้ว่าขายหน่วยใดไป\n' +
    'สินค้าที่มีไว้ขายในงวดมาจาก ' + lots.length + ' ล็อต:\n' + lotLines + '\nระหว่างงวดขายไป: ' + soldList + '\n' +
    'ให้คำนวณ' + (ask === 'cogs' ? 'ต้นทุนขาย' : 'สินค้าคงเหลือปลายงวด') + ' (บาท)\n' + ch2_RULE;
  const term = (q) => lots.map((l, i) => (q(i) > 0 ? q(i) + ' × ' + ch2_m(l.unit) : null)).filter(Boolean).join(' + ') || '0';
  const explain = [
    'ต้นทุนขาย = ' + term((i) => sold[i]) + ' = ' + ch2_m(cogs),
    'สินค้าคงเหลือปลายงวด = ' + term((i) => lots[i].qty - sold[i]) + ' = ' + ch2_m(end),
    'ตรวจ: ' + ch2_m(cogs) + ' + ' + ch2_m(end) + ' = ต้นทุนสินค้าที่มีไว้ขาย ' + ch2_m(cogs + end),
    'เหตุผล: วิธีราคาเจาะจงใช้ต้นทุนจริงของหน่วยที่ขาย (ต้นทุนขาย) และของหน่วยที่ยังเหลือ (สินค้าคงเหลือ)',
  ].join('\n');
  return { topicId: 'ch2.specific', mode: 'calc', title: 'ราคาเจาะจง (Specific identification)', text, explain,
    answer: ask === 'cogs' ? cogs : end, unit: 'บาท', tol: 0.5 };
}
function ch2_specificGen(rng) {
  for (;;) {
    const n = randInt(rng, 3, 4);
    let unit = randInt(rng, 10, 150) * 100;
    const lots = [];
    for (let i = 0; i < n; i++) {
      if (i > 0) unit = Math.min(20000, Math.max(1000, unit + (randInt(rng, -4, 8) || 3) * 100));
      lots.push({ qty: randInt(rng, 2, 10), unit });
    }
    const sold = lots.map((l) => randInt(rng, 0, l.qty));
    const nSold = sold.reduce((s, q) => s + q, 0);
    const nTotal = lots.reduce((s, l) => s + l.qty, 0);
    if (nSold < 2 || nTotal - nSold < 1) continue;
    return ch2_specificFrom({ rng, lots, sold, ask: pick(rng, ['cogs', 'end']) });
  }
}

// ---- 2/3/5. stock cards (fifo, lifo, mavg) ----
function ch2_cardRows(method, events, flow) {
  const N = { key: '', value: null, given: true };
  const rows = flow.rows.map((r, i) => {
    const e = events[i];
    const k = (f) => 'r' + i + '.' + f;
    const G = (f) => ({ key: k(f), value: r[f], given: true });
    const X = (f, tol) => ({ key: k(f), value: r[f], given: false, tol });
    const cells = {};
    for (const f of ch2_CARD_FIELDS) cells[f] = { ...N, key: k(f) };
    if (i === 0) {
      cells.balQty = G('balQty');
      cells.balUnit = { key: k('balUnit'), value: e.unit, given: true };
      cells.balTotal = G('balTotal');
    } else {
      if (e.type === 'buy') {
        cells.inQty = G('inQty');
        cells.inUnit = G('inUnit');
        cells.inTotal = G('inTotal');
      } else {
        cells.outQty = G('outQty');
        cells.outTotal = X('outTotal', 1);
      }
      cells.balQty = X('balQty', 0);
      if (method === 'mavg') cells.balUnit = X('balUnit', 0.01);
      cells.balTotal = X('balTotal', 1);
    }
    return { label: ch2_eventLabel(e, i), cells: ch2_CARD_FIELDS.map((f) => cells[f]) };
  });
  const summary = (label, field, key, value) => ({
    label,
    cells: ch2_CARD_FIELDS.map((f) => (f === field ? { key, value, given: false, tol: 1 } : { ...N, key: key + '.' + f })),
  });
  // null cells keep unique keys; they are given so never graded
  for (const row of rows) for (const c of row.cells) if (c.value === null) c.key = c.key + '.blank';
  const sumRows = [summary('ต้นทุนขายรวม', 'outTotal', 'cogs', flow.cogs), summary('สินค้าคงเหลือปลายงวด', 'balTotal', 'endValue', flow.endValue)];
  for (const row of sumRows) for (const c of row.cells) if (c.value === null) c.key = c.key + '.blank';
  return [...rows, ...sumRows];
}
function ch2_cardExplainLine(method, e, i, r) {
  const bal = (method === 'mavg')
    ? 'คงเหลือ ' + r.balQty + ' หน่วย ' + ch2_mx(r.balTotalExact) + (r.balQty > 0 ? ' (ทุนเฉลี่ย ' + ch2_u(r.balUnit) + ')' : '')
    : 'คงเหลือ ' + r.balQty + ' หน่วย = ' + ch2_layers(r.balLayers) + ' = ' + ch2_m(r.balTotal);
  if (i === 0) return e.date + ' ยอดยกมา ' + e.qty + ' × ' + ch2_m(e.unit) + ' = ' + ch2_m(r.balTotal);
  if (e.type === 'buy') {
    if (method === 'mavg') {
      return e.date + ' ซื้อ ' + e.qty + ' × ' + ch2_m(e.unit) + ' = ' + ch2_m(r.inTotal) + ' → คงเหลือ ' + r.balQty + ' หน่วย ' +
        ch2_mx(r.balTotalExact) + ' ต้นทุนเฉลี่ยใหม่ = ' + ch2_mx(r.balTotalExact) + ' ÷ ' + r.balQty + ' = ' + ch2_u(r.balUnit);
    }
    return e.date + ' ซื้อ ' + e.qty + ' × ' + ch2_m(e.unit) + ' = ' + ch2_m(r.inTotal) + ' → ' + bal;
  }
  const out = method === 'mavg' ? r.outQty + ' × ' + ch2_u(r.outUnit) + ' ≈ ' + ch2_m(r.outTotal) : ch2_layers(r.outLayers) + ' = ' + ch2_m(r.outTotal);
  return e.date + ' ขาย ' + r.outQty + ' หน่วย ตัดต้นทุน ' + out + ' → ' + bal;
}
const ch2_CARD_REASON = {
  fifo: 'FIFO: สินค้าที่ซื้อมาก่อนถูกขายออกไปก่อน ทุกครั้งที่ขายตัดชั้นต้นทุนที่เก่าที่สุด สินค้าคงเหลือจึงเป็นราคาล่าสุด',
  lifo: 'LIFO ระบบ Perpetual: ทุกครั้งที่ขายตัดชั้นต้นทุนที่ซื้อล่าสุด ณ วันที่ขาย — ' + ch2_LIFO_NOTE,
  mavg: 'ถัวเฉลี่ยเคลื่อนที่: คำนวณต้นทุนเฉลี่ยใหม่ทุกครั้งที่ซื้อ (ยอดรวมคงเหลือ ÷ จำนวนคงเหลือ) แล้วตัดต้นทุนขายด้วยต้นทุนเฉลี่ยล่าสุด ยอดรวมคิดจากยอดที่ยังไม่ปัด',
};
const ch2_CARD_TITLE = { fifo: 'บัญชีคุมสินค้า FIFO', lifo: 'บัญชีคุมสินค้า LIFO', mavg: 'บัญชีคุมสินค้า ถัวเฉลี่ยเคลื่อนที่' };
function ch2_cardFrom(method, params) {
  const set = ch2_setting(params);
  const events = ch2_withDays(params.events);
  const flow = costFlow(method, events);
  const other = method === 'fifo' ? costFlow('lifo', events) : method === 'lifo' ? costFlow('fifo', events) : costFlow('wavg', events);
  const text = ch2_intro(set, events, 'ระบบ Perpetual') + '\nให้จัดทำบัญชีคุมสินค้า (stock card) ตามวิธี' + ch2_METHOD_NAMES[method] +
    ' แล้วสรุปต้นทุนขายและสินค้าคงเหลือปลายงวด\n' + ch2_RULE + (method === 'lifo' ? '\nหมายเหตุ: ' + ch2_LIFO_NOTE : '');
  const explain = [
    ...flow.rows.map((r, i) => ch2_cardExplainLine(method, events[i], i, r)),
    'ต้นทุนขายรวม = ' + ch2_m(flow.cogs) + ', สินค้าคงเหลือปลายงวด = ' + ch2_m(flow.endValue) +
      ' (ตรวจ: ต้นทุนสินค้าที่มีไว้ขาย ' + ch2_m(flow.costAvailable) + ' = ' + ch2_m(flow.cogs) + ' + ' + ch2_m(flow.endValue) + ')',
    'เหตุผล: ' + ch2_CARD_REASON[method],
  ].join('\n');
  const code = method === 'mavg' ? 'ch2.avg-methods-mixed' : 'ch2.fifo-lifo-swapped';
  const checks = [['cogs', flow.cogs, other.cogs, code, 1], ['endValue', flow.endValue, other.endValue, code, 1]];
  if (method !== 'mavg') {
    flow.rows.forEach((r, i) => {
      if (i === 0) return;
      if (r.outTotal !== null) checks.push(['r' + i + '.outTotal', r.outTotal, other.rows[i].outTotal, code, 1]);
      checks.push(['r' + i + '.balTotal', r.balTotal, other.rows[i].balTotal, code, 1]);
    });
  }
  const unitCells = method === 'mavg' ? flow.rows.map((r, i) => ['r' + i + '.balUnit', r.balUnit]).slice(1) : [];
  return {
    topicId: 'ch2.' + method, mode: 'table', title: ch2_CARD_TITLE[method], text, explain,
    columns: ch2_CARD_COLUMNS.slice(), rows: ch2_cardRows(method, events, flow), events,
    diagnoseTable: (answers) => [...ch2_diagOther(answers, checks), ...ch2_diagRounding(answers, unitCells)],
  };
}

// ---- 4. weighted average (periodic) ----
function ch2_wavgFrom(params) {
  const set = ch2_setting(params);
  const events = ch2_withDays(params.events);
  const flow = costFlow('wavg', events);
  const mv = costFlow('mavg', events);
  const buys = events.filter((e) => e.type === 'buy');
  const sold = flow.unitsAvailable - flow.endQty;
  const exactAvg = flow.costAvailable / flow.unitsAvailable;
  const N = (k) => ({ key: k + '.blank', value: null, given: true });
  const rows = [
    ...buys.map((e, i) => ({
      label: e.date + (i === 0 ? ' ยอดยกมา' : ' ซื้อ'),
      cells: [{ key: 'b' + i + '.qty', value: e.qty, given: true }, { key: 'b' + i + '.unit', value: e.unit, given: true },
        { key: 'b' + i + '.total', value: e.qty * e.unit, given: true }],
    })),
    { label: 'รวมสินค้าที่มีไว้ขาย', cells: [{ key: 'unitsAvailable', value: flow.unitsAvailable, given: false, tol: 0 }, N('avail.unit'),
      { key: 'costAvailable', value: flow.costAvailable, given: false, tol: 1 }] },
    { label: 'ต้นทุนเฉลี่ยต่อหน่วย', cells: [N('avg.qty'), { key: 'unitCost', value: flow.unit, given: false, tol: 0.01 }, N('avg.total')] },
    { label: 'ต้นทุนขาย', cells: [{ key: 'sold.qty', value: sold, given: true }, N('sold.unit'), { key: 'cogs', value: flow.cogs, given: false, tol: 1 }] },
    { label: 'สินค้าคงเหลือปลายงวด', cells: [{ key: 'end.qty', value: flow.endQty, given: true }, N('end.unit'),
      { key: 'endValue', value: flow.endValue, given: false, tol: 1 }] },
  ];
  const approx = ch2_round(exactAvg, 2) === exactAvg ? ' = ' : ' ≈ ';
  const text = ch2_intro(set, events, 'ระบบ Periodic') + '\nให้คำนวณต้นทุนขายและสินค้าคงเหลือปลายงวดด้วยวิธี' + ch2_METHOD_NAMES.wavg +
    ' (คำนวณต้นทุนเฉลี่ยครั้งเดียวสำหรับทั้งงวด)\n' + ch2_RULE;
  const explain = [
    'สินค้าที่มีไว้ขาย = ' + buys.map((e) => e.qty).join(' + ') + ' = ' + flow.unitsAvailable + ' หน่วย ต้นทุนรวม ' +
      buys.map((e) => ch2_m(e.qty * e.unit)).join(' + ') + ' = ' + ch2_m(flow.costAvailable),
    'ต้นทุนเฉลี่ย = ' + ch2_m(flow.costAvailable) + ' ÷ ' + flow.unitsAvailable + approx + ch2_u(flow.unit),
    'สินค้าคงเหลือปลายงวด = ' + flow.endQty + ' × ' + ch2_u(flow.unit) + approx + ch2_m(flow.endValue),
    'ต้นทุนขาย = ' + sold + ' × ' + ch2_u(flow.unit) + approx + ch2_m(flow.cogs) + ' (= ' + ch2_m(flow.costAvailable) + ' − ' + ch2_m(flow.endValue) + ')',
    'เหตุผล: ถัวเฉลี่ยถ่วงน้ำหนักถ่วงราคาด้วยจำนวนหน่วย (ต้นทุนรวม ÷ หน่วยรวม) ไม่ใช่เฉลี่ยราคาต่อหน่วยตรง ๆ',
  ].join('\n');
  const simple = ch2_round(buys.reduce((s, e) => s + e.unit, 0) / buys.length, 2);
  const checks = [['cogs', flow.cogs, mv.cogs, 'ch2.avg-methods-mixed', 1], ['endValue', flow.endValue, mv.endValue, 'ch2.avg-methods-mixed', 1],
    ['unitCost', flow.unit, simple, 'ch2.simple-average', 0.01]];
  return {
    topicId: 'ch2.wavg', mode: 'table', title: 'ถัวเฉลี่ยถ่วงน้ำหนัก', text, explain,
    columns: ['รายการ', 'จำนวน (หน่วย)', 'ราคาทุน/หน่วย', 'รวม (บาท)'], rows, events,
    diagnoseTable: (answers) => [...ch2_diagOther(answers, checks), ...ch2_diagRounding(answers, [['unitCost', flow.unit]])],
  };
}

// ---- 6. compare all four methods ----
function ch2_compareFrom(params) {

  const rows = ch2_METHODS.map((m) => ({
    label: ch2_METHOD_NAMES[m],
    cells: [{ key: m + '.cogs', value: flows[m].cogs, given: false, tol: 1 }, { key: m + '.endValue', value: flows[m].endValue, given: false, tol: 1 }],
  }));
  const text = ch2_intro(set, events, '') + '\nให้คำนวณต้นทุนขายและสินค้าคงเหลือปลายงวดทั้ง 4 วิธี\n' +
    '(FIFO, LIFO และถัวเฉลี่ยเคลื่อนที่ใช้ระบบ Perpetual ตัดต้นทุนทุกครั้งที่ขาย; ถัวเฉลี่ยถ่วงน้ำหนักคำนวณต้นทุนเฉลี่ยครั้งเดียวทั้งงวด)\n' +
    ch2_RULE + '\nหมายเหตุ: ' + ch2_LIFO_NOTE;
  const explain = [
    'ต้นทุนสินค้าที่มีไว้ขาย ' + ch2_m(flows.fifo.costAvailable) + ' (' + flows.fifo.unitsAvailable + ' หน่วย) = ต้นทุนขาย + สินค้าคงเหลือ ทุกวิธี',
    ...ch2_METHODS.map((m) => ch2_METHOD_NAMES[m] + ': ต้นทุนขาย ' + ch2_m(flows[m].cogs) + ', สินค้าคงเหลือ ' + ch2_m(flows[m].endValue) +
      (m === 'wavg' ? ' (ต้นทุนเฉลี่ย ' + ch2_u(flows[m].unit) + ')' : '')),
    'เหตุผล: เมื่อราคาสูงขึ้น FIFO ให้ต้นทุนขายต่ำสุด (สินค้าคงเหลือสูงสุด) LIFO ตรงข้าม ส่วนวิธีถัวเฉลี่ยมักอยู่ระหว่างกลาง',
  ].join('\n');
  const checks = [];
  for (const [a, b, code] of [['fifo', 'lifo', 'ch2.fifo-lifo-swapped'], ['lifo', 'fifo', 'ch2.fifo-lifo-swapped'],
    ['wavg', 'mavg', 'ch2.avg-methods-mixed'], ['mavg', 'wavg', 'ch2.avg-methods-mixed']]) {
    checks.push([a + '.cogs', flows[a].cogs, flows[b].cogs, code, 1], [a + '.endValue', flows[a].endValue, flows[b].endValue, code, 1]);
  }
  return {
    topicId: 'ch2.compare', mode: 'table', title: 'เปรียบเทียบ 4 วิธี', text, explain,
    columns: ['วิธี', 'ต้นทุนขาย', 'สินค้าคงเหลือปลายงวด'], rows, events,
    diagnoseTable: (answers) => ch2_diagOther(answers, checks),
  };
}
