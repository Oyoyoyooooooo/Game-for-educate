// Chapter 3 — VAT 7%, Perpetual system (slides 24.09 Tax, Tax2).

const MISTAKE_LABELS_CH3 = {
  'ch3.vat-from-gross': 'ราคานี้รวม VAT แล้ว ต้องแยก VAT ด้วย ×7/107 (ฐานภาษี = ×100/107) ไม่ใช่คิด 7% ของราคารวม VAT',
  'ch3.cash-disc-reduced-vat': 'ส่วนลดเงินสดไม่ลดฐานภาษี — VAT คิดจากราคาก่อนหักส่วนลดเงินสด (เฉพาะส่วนลดการค้าที่ลดฐานภาษี)',
  'ch3.forgot-cogs': 'ขายสินค้าแล้วลืมบันทึกต้นทุนขาย (Dr ต้นทุนขาย / Cr สินค้าคงเหลือ)',
  'ch3.periodic-account': 'ระบบ Perpetual บันทึกผ่านบัญชีสินค้าคงเหลือโดยตรง (ไม่ใช้บัญชีซื้อ/ส่งคืน/ส่วนลดรับ/ค่าขนส่งเข้า)',
};

const ch3_RATE = 0.07;
const ch3_DECOYS = ['purchases', 'purchaseReturns', 'purchaseDiscounts', 'freightIn'];
const ch3_ACCTS = ['cash', 'ar', 'inventory', 'ap', 'sales', 'salesReturns', 'salesDiscounts', 'cogs',
  'inputVat', 'outputVat', 'suspInputVat', 'suspOutputVat', 'vatPayable', 'vatReceivable',
  'serviceExpense', 'serviceRevenue', 'promoExpense', ...ch3_DECOYS];
const ch3_TERMS = ['2/10, n/30', '3/10, n/30'];
const ch3_SHOPS = ['ร้านสมใจ', 'ร้านรุ่งเรืองพาณิชย์', 'ร้านเจริญดี', 'ร้านมั่นคงการค้า', 'ร้านใจดีสโตร์', 'ร้านสุขสันต์'];
const ch3_GOODS = ['เสื้อยืด', 'รองเท้า', 'กระเป๋า', 'นาฬิกา', 'หม้อหุงข้าว', 'พัดลม', 'โคมไฟ'];
const ch3_SERVICES = ['ค่าโฆษณา', 'ค่าซ่อมแซม', 'ค่าที่ปรึกษา', 'ค่าออกแบบ', 'ค่าทำความสะอาด'];

// ---- exported helpers ----
function vatOf(base) {
  return Math.round(base * 7) / 100;
}
function splitGross(gross) {
  const base = Math.round((gross * 100) / 107 * 100) / 100;
  const vat = Math.round((gross - base) * 100) / 100;
  return { base, vat };
}

// ---- private helpers ----
function ch3_L(acct, dr, cr) {
  return { acct, dr, cr };
}
function ch3_m(n) {
  return formatMoney(n);
}
function ch3_date(d) {
  return d + ' ก.ย. 25x1';
}
function ch3_rngFor(params) {
  return params.rng || makeRng(7);
}
function ch3_accounts(rng) {
  return shuffle(rng, ch3_ACCTS);
}
function ch3_name(acct) {
  return ACCOUNTS[acct].th;
}
function ch3_pct(rate) {
  return Math.round(rate * 100);
}
function ch3_termsFor(rate) {
  return ch3_pct(rate) + '/10, n/30';
}
function ch3_amt(got, acct) {
  return got.get(acct) || 0;
}

function ch3_explain(entries, reason) {
  const blocks = entries.map((entry, i) => {
    const dr = entry.filter((l) => l.dr > 0).map((l) => 'Dr ' + ch3_name(l.acct) + ' ' + ch3_m(l.dr));
    const cr = entry.filter((l) => l.cr > 0).map((l) => '    Cr ' + ch3_name(l.acct) + ' ' + ch3_m(l.cr));
    return (entries.length > 1 ? '(' + (i + 1) + ') ' : '') + [...dr, ...cr].join('\n');
  });
  return blocks.join('\n') + '\nเหตุผล: ' + reason;
}

// ---- diagnoses (journal) ----
function ch3_diagPeriodic(got) {
  return ch3_DECOYS.filter((a) => got.has(a)).map((a) => ({
    code: 'ch3.periodic-account',
    acct: a,
    msg: 'ใช้บัญชี ' + ch3_name(a) + ' ซึ่งเป็นของระบบ Periodic — ' + MISTAKE_LABELS_CH3['ch3.periodic-account'],
  }));
}
function ch3_diagForgotCogs(got) {
  if (Math.abs(ch3_amt(got, 'cogs')) >= 0.5) return [];
  return [{ code: 'ch3.forgot-cogs', acct: 'cogs', msg: MISTAKE_LABELS_CH3['ch3.forgot-cogs'] }];
}
// vatAcct = inputVat | outputVat; fires when VAT equals 7% of the VAT-included price
function ch3_diagVatFromGross(vatAcct, gross, expectedVat) {
  return (got) => {
    const wrong = vatOf(gross);
    const have = Math.abs(ch3_amt(got, vatAcct));
    if (Math.abs(have - expectedVat) < 0.5 || Math.abs(have - wrong) >= 0.5) return [];
    return [{ code: 'ch3.vat-from-gross', acct: vatAcct, msg: MISTAKE_LABELS_CH3['ch3.vat-from-gross'] }];
  };
}
// recv: outputVat computed on (base - discount) or cash reduced by discount incl. VAT
function ch3_diagCashDiscRecv(base, disc, ar) {
  return (got) => {
    const out = [];
    const msg = MISTAKE_LABELS_CH3['ch3.cash-disc-reduced-vat'];
    const vatWrong = vatOf(base - disc);
    if (Math.abs(Math.abs(ch3_amt(got, 'outputVat')) - vatWrong) < 0.5 && Math.abs(vatWrong - vatOf(base)) >= 0.5) {
      out.push({ code: 'ch3.cash-disc-reduced-vat', acct: 'outputVat', msg });
    }
    if (Math.abs(ch3_amt(got, 'cash') - (ar - disc - vatOf(disc))) < 0.5) {
      out.push({ code: 'ch3.cash-disc-reduced-vat', acct: 'cash', msg });
    }
    return out;
  };
}
function ch3_diagCashDiscPay(ap, disc) {
  return (got) => {
    if (Math.abs(ch3_amt(got, 'cash') + (ap - disc - vatOf(disc))) >= 0.5) return [];
    return [{ code: 'ch3.cash-disc-reduced-vat', acct: 'cash', msg: MISTAKE_LABELS_CH3['ch3.cash-disc-reduced-vat'] }];
  };
}
function ch3_diag(...extra) {
  return (got) => [...ch3_diagPeriodic(got), ...extra.flatMap((f) => f(got))];
}

function ch3_journal(topicId, title, rng, text, entries, reason, extraDiag) {
  return {
    topicId,
    mode: 'journal',
    title,
    text,
    explain: ch3_explain(entries, reason),
    accounts: ch3_accounts(rng),
    entries,
    diagnose: ch3_diag(...(extraDiag || [])),
  };
}

// ---- 1. calc ----
const ch3_CALC_TITLE = {
  vat: 'คำนวณ VAT จากราคาไม่รวม VAT',
  vatFromGross: 'แยก VAT จากราคารวม VAT',
  baseFromGross: 'หาราคาก่อน VAT จากราคารวม VAT',
};
function ch3_calcFrom(params) {
  const kind = params.kind || 'vat';
  const shop = params.shop || ch3_SHOPS[0];
  const goods = params.goods || ch3_GOODS[0];
  let text;
  let answer;
  let reason;
  let wrongValue;
  if (kind === 'vat') {
    const base = params.base;
    answer = vatOf(base);
    text = shop + ' ขาย' + goods + 'ราคา ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT) อัตรา VAT 7%\nVAT (ภาษีขาย) เป็นเท่าใด (บาท)';
    reason = 'ราคาไม่รวม VAT: VAT = ราคา × 7% = ' + ch3_m(base) + ' × 7% = ' + ch3_m(answer);
  } else {
    const gross = params.gross;
    const { base, vat } = splitGross(gross);
    wrongValue = kind === 'vatFromGross' ? vatOf(gross) : Math.round((gross - vatOf(gross)) * 100) / 100;
    if (kind === 'vatFromGross') {
      answer = vat;
      text = shop + ' ซื้อ' + goods + 'ราคารวม VAT 7% แล้ว ' + ch3_m(gross) + ' บาท\nVAT (ภาษีซื้อ) ที่รวมอยู่ในราคานี้เป็นเท่าใด (บาท)';
      reason = 'ราคารวม VAT: VAT = ราคารวม × 7/107 = ' + ch3_m(gross) + ' × 7/107 = ' + ch3_m(vat) +
        ' (ไม่ใช่ ×7% เพราะ 7% ใช้กับราคาที่ยังไม่รวม VAT เท่านั้น) ตรวจ: ราคาก่อน VAT ' + ch3_m(base) + ' + VAT ' + ch3_m(vat) + ' = ' + ch3_m(gross);
    } else {
      answer = base;
      text = shop + ' ขาย' + goods + 'ราคารวม VAT 7% แล้ว ' + ch3_m(gross) + ' บาท\nราคาขายก่อน VAT (ฐานภาษี) เป็นเท่าใด (บาท)';
      reason = 'ราคาก่อน VAT = ราคารวม × 100/107 = ' + ch3_m(gross) + ' × 100/107 = ' + ch3_m(base) +
        ' ตรวจ: ' + ch3_m(base) + ' + VAT ' + ch3_m(vat) + ' = ' + ch3_m(gross);
    }
  }
  const p = {
    topicId: 'ch3.calc', mode: 'calc', title: ch3_CALC_TITLE[kind], text, explain: reason, answer, unit: 'บาท', tol: 0.5,
  };
  p.diagnoseCalc = (n) => {
    if (wrongValue === undefined || typeof n !== 'number') return [];
    if (Math.abs(n - answer) < 0.5 || Math.abs(n - wrongValue) >= 0.5) return [];
    return [{ code: 'ch3.vat-from-gross', msg: MISTAKE_LABELS_CH3['ch3.vat-from-gross'] }];
  };
  return p;
}
function ch3_calcGen(rng) {
  const kind = pick(rng, ['vat', 'vatFromGross', 'baseFromGross']);
  const base = randInt(rng, 5, 400) * 100;
  const common = { rng, kind, shop: pick(rng, ch3_SHOPS), goods: pick(rng, ch3_GOODS) };
  return ch3_calcFrom(kind === 'vat' ? { ...common, base } : { ...common, gross: base + vatOf(base) });
}

// ---- 2. liability table ----
function ch3_liabilityFrom(params) {
  const { output, input } = params;
  const shop = params.shop || ch3_SHOPS[0];
  const pay = output > input;
  const diff = Math.abs(output - input);
  const text = shop + ' เดือน ก.ย. 25x1 มีภาษีขาย ' + ch3_m(output) + ' บาท และภาษีซื้อ ' + ch3_m(input) +
    ' บาท\nให้คำนวณภาษีมูลค่าเพิ่มสุทธิ: กรอกจำนวนเงิน และประเภท (ใส่ 1 = ต้องชำระภาษี, -1 = ขอคืนภาษี/เครดิตภาษี)';
  const rows = [
    { label: 'ภาษีขาย (Output VAT)', cells: [{ key: 'output', value: output, given: true }] },
    { label: 'ภาษีซื้อ (Input VAT)', cells: [{ key: 'input', value: input, given: true }] },
    { label: 'ภาษีที่ต้องชำระ/ขอคืน (จำนวนเงิน | ประเภท)', cells: [
      { key: 'amount', value: diff, given: false },
      { key: 'kind', value: pay ? 1 : -1, given: false },
    ] },
  ];
  const explain = 'ภาษีขาย − ภาษีซื้อ = ' + ch3_m(output) + ' − ' + ch3_m(input) + ' = ' + ch3_m(output - input) + '\n' +
    (pay ? 'ภาษีขายมากกว่าภาษีซื้อ → ต้องชำระภาษี ' + ch3_m(diff) + ' บาท (ประเภท 1)'
      : 'ภาษีซื้อมากกว่าภาษีขาย → ขอคืนภาษี/เครดิตภาษี ' + ch3_m(diff) + ' บาท (ประเภท -1)') +
    '\nเหตุผล: ภาษีที่ต้องชำระ = ภาษีขาย − ภาษีซื้อ ถ้าติดลบให้ขอคืนหรือยกไปเป็นเครดิตภาษี';
  return { topicId: 'ch3.liability', mode: 'table', title: 'ภาษีที่ต้องชำระ/ขอคืน', text, explain,
    columns: ['รายการ', 'จำนวนเงิน (บาท)', 'ประเภท (1 = ชำระ, -1 = ขอคืน)'], rows };
}
function ch3_drawOutIn(rng) {
  const refund = rng() < 0.4;
  const a = randInt(rng, 6, 200) * 50;
  let b;
  do {
    b = randInt(rng, 6, 200) * 50;
  } while (b === a);
  const hi = Math.max(a, b);
  const lo = Math.min(a, b);
  return refund ? { output: lo, input: hi } : { output: hi, input: lo };
}

// ---- 3. buy / sell with VAT ----
function ch3_buysellFrom(params) {
  const rng = ch3_rngFor(params);
  const variant = params.variant || 'buy';
  const credit = params.credit !== false;
  const base = params.base;
  const vat = vatOf(base);
  const total = base + vat;
  const cost = params.cost;
  const day = params.day || 5;
  const shop = params.shop || ch3_SHOPS[0];
  const goods = params.goods ? params.goods + ' ' : '';
  const terms = params.terms || ch3_TERMS[0];
  const head = ch3_date(day) + ' ' + shop + ' (ระบบ Perpetual) ';
  const priceText = params.gross
    ? 'ราคารวม VAT 7% แล้ว ' + ch3_m(total) + ' บาท'
    : 'ราคา ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%)';
  const calc = params.gross
    ? 'ราคารวม VAT ' + ch3_m(total) + ' → ราคาก่อน VAT = ' + ch3_m(total) + ' × 100/107 = ' + ch3_m(base) + ' VAT = ' + ch3_m(total) + ' × 7/107 = ' + ch3_m(vat) + '. '
    : 'VAT = ' + ch3_m(base) + ' × 7% = ' + ch3_m(vat) + '. ';
  let text;
  let entries;
  let reason;
  let extra = [];
  if (variant === 'buy') {
    text = head + 'ซื้อสินค้า ' + goods + priceText + ' ' + (credit ? 'เป็นเงินเชื่อ เงื่อนไข ' + terms : 'เป็นเงินสด') + '\nให้บันทึกรายการซื้อสินค้า';
    entries = [[ch3_L('inventory', base, 0), ch3_L('inputVat', vat, 0), ch3_L(credit ? 'ap' : 'cash', 0, total)]];
    reason = calc + 'Perpetual เดบิตสินค้าคงเหลือตามราคาก่อน VAT และเดบิตภาษีซื้อ (สินทรัพย์) ' +
      (credit ? 'เครดิตเจ้าหนี้การค้า' : 'เครดิตเงินสด') + 'เต็มจำนวนรวม VAT ' + ch3_m(total);
    if (params.gross) extra = [ch3_diagVatFromGross('inputVat', total, vat)];
  } else if (variant === 'sell') {
    text = head + 'ขายสินค้า ' + goods + priceText + ' ' + (credit ? 'เป็นเงินเชื่อ เงื่อนไข ' + terms : 'ได้รับเงินสด') +
      ' ต้นทุนของสินค้าที่ขาย ' + ch3_m(cost) + ' บาท\nให้บันทึกรายการขาย';
    entries = [
      [ch3_L(credit ? 'ar' : 'cash', total, 0), ch3_L('sales', 0, base), ch3_L('outputVat', 0, vat)],
      [ch3_L('cogs', cost, 0), ch3_L('inventory', 0, cost)],
    ];
    reason = calc + 'รายการที่ 1 รับรู้รายได้ตามราคาก่อน VAT และเครดิตภาษีขาย (หนี้สิน) รับ' + (credit ? 'ลูกหนี้' : 'เงินสด') +
      'รวม VAT ' + ch3_m(total) + ' รายการที่ 2 โอนต้นทุน ' + ch3_m(cost) + ' เป็นต้นทุนขาย (VAT ไม่เกี่ยวกับต้นทุน)';
    extra = [ch3_diagForgotCogs];
    if (params.gross) extra.push(ch3_diagVatFromGross('outputVat', total, vat));
  } else if (variant === 'preturn') {
    text = head + 'ส่งคืนสินค้าที่ซื้อ ' + goods + 'ราคา ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%) ' +
      (credit ? '(ซื้อเป็นเงินเชื่อ ยังไม่ได้ชำระ ผู้ขายลดหนี้ให้)' : '(ซื้อเป็นเงินสด ผู้ขายคืนเงินสดให้)') + '\nให้บันทึกรายการส่งคืนสินค้า';
    entries = [[ch3_L(credit ? 'ap' : 'cash', total, 0), ch3_L('inventory', 0, base), ch3_L('inputVat', 0, vat)]];
    reason = 'VAT = ' + ch3_m(base) + ' × 7% = ' + ch3_m(vat) + '. ส่งคืนสินค้าต้องคืนภาษีซื้อด้วย: เครดิตสินค้าคงเหลือ ' + ch3_m(base) +
      ' และเครดิตภาษีซื้อ ' + ch3_m(vat) + ' ลด' + (credit ? 'เจ้าหนี้การค้า' : 'เงินสดที่ได้คืน') + ' ' + ch3_m(total);
  } else {
    text = head + 'ลูกค้าส่งคืนสินค้าที่ซื้อไป ราคาขาย ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%) ต้นทุน ' + ch3_m(cost) +
      ' บาท สินค้าอยู่ในสภาพดี นำกลับเข้าสต๊อก ' +
      (credit ? '(ขายเป็นเงินเชื่อ ลูกค้ายังไม่ได้ชำระ จึงลดหนี้ให้)' : '(ขายเป็นเงินสด จึงคืนเงินสดให้ลูกค้า)') +
      '\nให้บันทึกรายการรับคืนสินค้า';
    entries = [
      [ch3_L('salesReturns', base, 0), ch3_L('outputVat', vat, 0), ch3_L(credit ? 'ar' : 'cash', 0, total)],
      [ch3_L('inventory', cost, 0), ch3_L('cogs', 0, cost)],
    ];
    reason = 'VAT = ' + ch3_m(base) + ' × 7% = ' + ch3_m(vat) + '. รับคืนสินค้าต้องลดภาษีขายด้วย: Dr รับคืนและส่วนลดจ่าย ' + ch3_m(base) +
      ', Dr ภาษีขาย ' + ch3_m(vat) + ' ลด' + (credit ? 'ลูกหนี้' : 'เงินสด') + ' ' + ch3_m(total) +
      ' และนำสินค้ากลับเข้าสต๊อกตามราคาทุน ' + ch3_m(cost);
  }
  const titles = { buy: 'ซื้อสินค้า (มี VAT)', sell: 'ขายสินค้า (มี VAT)', preturn: 'ส่งคืนสินค้าที่ซื้อ (มี VAT)', sreturn: 'รับคืนสินค้า (มี VAT)' };
  return ch3_journal('ch3.buysell', titles[variant], rng, text, entries, reason, extra);
}
function ch3_buysellGen(rng) {
  const variant = pick(rng, ['buy', 'buy', 'sell', 'sell', 'preturn', 'sreturn']);
  const base = randInt(rng, 5, 600) * 100;
  const cost = roundTo(base * (randInt(rng, 55, 80) / 100), 100);
  return ch3_buysellFrom({ rng, variant, base, cost: variant === 'sell' || variant === 'sreturn' ? Math.max(cost, 100) : undefined,
    credit: rng() < 0.65, gross: (variant === 'buy' || variant === 'sell') && rng() < 0.3,
    day: randInt(rng, 1, 28), shop: pick(rng, ch3_SHOPS), goods: pick(rng, ch3_GOODS), terms: pick(rng, ch3_TERMS) });
}

// ---- 4. discounts ----
function ch3_discountFrom(params) {
  const rng = ch3_rngFor(params);
  const kind = params.kind || 'recv';
  const shop = params.shop || ch3_SHOPS[0];
  const head = shop + ' (ระบบ Perpetual) ';
  if (kind === 'trade') return ch3_tradeFrom(params, rng, head);
  const base = params.base;
  const rate = params.cashRate;
  const within = params.within !== false;
  const vat = vatOf(base);
  const total = base + vat;
  const disc = Math.round((base * ch3_pct(rate)) / 100);
  const terms = ch3_termsFor(rate);
  const d1 = params.day || 3;
  const d2 = params.payDay || (within ? d1 + 8 : d1 + 18);
  const period = within ? 'อยู่ภายในกำหนดส่วนลด (ภายใน 10 วัน)' : 'เกินกำหนดส่วนลดแล้ว (เกิน 10 วัน)';
  const pctText = ch3_pct(rate) + '%';
  if (kind === 'recv') {
    const rcost = params.cost !== undefined ? params.cost : Math.max(100, roundTo(base * 0.7, 100));
    const text = ch3_date(d1) + ' ' + head + 'ขายสินค้าเป็นเงินเชื่อ ราคา ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%) เงื่อนไข ' + terms +
      ' ต้นทุนของสินค้าที่ขาย ' + ch3_m(rcost) + ' บาท\n' + ch3_date(d2) + ' ลูกค้าชำระหนี้ทั้งจำนวน — ' + period + '\nให้บันทึกรายการขาย (รวมต้นทุนขาย) และรายการรับชำระหนี้';
    const recv = within
      ? [ch3_L('cash', total - disc, 0), ch3_L('salesDiscounts', disc, 0), ch3_L('ar', 0, total)]
      : [ch3_L('cash', total, 0), ch3_L('ar', 0, total)];
    const entries = [[ch3_L('ar', total, 0), ch3_L('sales', 0, base), ch3_L('outputVat', 0, vat)],
      [ch3_L('cogs', rcost, 0), ch3_L('inventory', 0, rcost)], recv];
    const reason = 'รายการขาย: VAT = ' + ch3_m(base) + ' × 7% = ' + ch3_m(vat) + ' ลูกหนี้ ' + ch3_m(total) +
      ' และบันทึกต้นทุนขาย ' + ch3_m(rcost) + ' (Dr ต้นทุนขาย / Cr สินค้าคงเหลือ). ' + (within
      ? 'รับชำระภายในกำหนด ส่วนลดเงินสดคิดจากราคาขายก่อน VAT = ' + ch3_m(base) + ' × ' + pctText + ' = ' + ch3_m(disc) +
        ' บันทึกเป็นส่วนลดจ่าย รับเงินสด ' + ch3_m(total) + ' − ' + ch3_m(disc) + ' = ' + ch3_m(total - disc) +
        ' ส่วนลดเงินสดไม่ลดฐานภาษี จึงไม่แก้ภาษีขาย ' + ch3_m(vat)
      : 'เกินกำหนดส่วนลดจึงไม่ได้ส่วนลด รับเงินเต็มจำนวน ' + ch3_m(total));
    return ch3_journal('ch3.discount', 'ส่วนลดเงินสด (ฝั่งขาย)', rng, text, entries, reason,
      (within ? [ch3_diagCashDiscRecv(base, disc, total)] : []).concat([ch3_diagForgotCogs]));
  }
  const text = ch3_date(d1) + ' ' + head + 'ซื้อสินค้าเป็นเงินเชื่อ ราคา ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%) เงื่อนไข ' + terms +
    ' (บันทึกการซื้อแล้ว เจ้าหนี้รวม VAT ' + ch3_m(total) + ' บาท)\n' + ch3_date(d2) + ' จ่ายชำระหนี้ทั้งจำนวน — ' + period +
    '\nให้บันทึกรายการจ่ายชำระหนี้';
  const entries = within
    ? [[ch3_L('ap', total, 0), ch3_L('cash', 0, total - disc), ch3_L('inventory', 0, disc)]]
    : [[ch3_L('ap', total, 0), ch3_L('cash', 0, total)]];
  const reason = within
    ? 'ส่วนลดเงินสดคิดจากราคาซื้อก่อน VAT = ' + ch3_m(base) + ' × ' + pctText + ' = ' + ch3_m(disc) + ' (ไม่ใช่จากยอดรวม VAT ' + ch3_m(total) +
      ') Perpetual ลดสินค้าคงเหลือโดยตรง จ่ายเงินสด ' + ch3_m(total) + ' − ' + ch3_m(disc) + ' = ' + ch3_m(total - disc) +
      ' ส่วนลดเงินสดไม่ลดภาษีซื้อ'
    : 'เกินกำหนดส่วนลดจึงจ่ายเต็มจำนวน ' + ch3_m(total);
  return ch3_journal('ch3.discount', 'ส่วนลดเงินสด (ฝั่งซื้อ)', rng, text, entries, reason,
    within ? [ch3_diagCashDiscPay(total, disc)] : []);
}
function ch3_tradeFrom(params, rng, head) {
  const { list, tradeRate } = params;
  const side = params.side || 'sell';
  const credit = params.credit !== false;
  const pct = ch3_pct(tradeRate);
  const net = Math.round((list * (100 - pct)) / 100);
  const td = list - net;
  const vat = vatOf(net);
  const total = net + vat;
  const day = params.day || 6;
  const calc = 'ส่วนลดการค้า ' + pct + '% = ' + ch3_m(list) + ' × ' + pct + '% = ' + ch3_m(td) + ' ราคาสุทธิ ' + ch3_m(net) +
    ' ส่วนลดการค้าลดฐานภาษี จึงคิด VAT จากราคาสุทธิ: ' + ch3_m(net) + ' × 7% = ' + ch3_m(vat) + '. ';
  if (side === 'sell') {
    const cost = params.cost;
    const text = ch3_date(day) + ' ' + head + 'ขายสินค้า ราคาตามรายการราคา ' + ch3_m(list) + ' บาท (ยังไม่รวม VAT 7%) ให้ส่วนลดการค้า ' + pct +
      '% ' + (credit ? 'เป็นเงินเชื่อ' : 'ได้รับเงินสด') + ' ต้นทุนของสินค้าที่ขาย ' + ch3_m(cost) + ' บาท\nให้บันทึกรายการขาย';
    const entries = [
      [ch3_L(credit ? 'ar' : 'cash', total, 0), ch3_L('sales', 0, net), ch3_L('outputVat', 0, vat)],
      [ch3_L('cogs', cost, 0), ch3_L('inventory', 0, cost)],
    ];
    return ch3_journal('ch3.discount', 'ส่วนลดการค้า (ฝั่งขาย)', rng, text, entries,
      calc + 'บันทึกขายสุทธิ ' + ch3_m(net) + ' (ไม่บันทึกส่วนลดการค้าเป็นบัญชีแยก) ' + (credit ? 'ลูกหนี้' : 'เงินสด') + ' ' + ch3_m(total) +
      ' และต้นทุนขาย ' + ch3_m(cost), [ch3_diagForgotCogs]);
  }
  const text = ch3_date(day) + ' ' + head + 'ซื้อสินค้า ราคาตามรายการราคา ' + ch3_m(list) + ' บาท (ยังไม่รวม VAT 7%) ได้รับส่วนลดการค้า ' + pct +
    '% ' + (credit ? 'เป็นเงินเชื่อ' : 'เป็นเงินสด') + '\nให้บันทึกรายการซื้อสินค้า';
  const entries = [[ch3_L('inventory', net, 0), ch3_L('inputVat', vat, 0), ch3_L(credit ? 'ap' : 'cash', 0, total)]];
  return ch3_journal('ch3.discount', 'ส่วนลดการค้า (ฝั่งซื้อ)', rng, text, entries,
    calc + 'เดบิตสินค้าคงเหลือ ' + ch3_m(net) + ' และภาษีซื้อ ' + ch3_m(vat) + ' ' + (credit ? 'เครดิตเจ้าหนี้การค้า' : 'เครดิตเงินสด') + ' ' + ch3_m(total));
}
function ch3_discountGen(rng) {
  const k = rng();
  const shop = pick(rng, ch3_SHOPS);
  const day = randInt(rng, 1, 10);
  if (k < 0.3) {
    const list = randInt(rng, 3, 300) * 2000;
    const tradeRate = pick(rng, [0.1, 0.2, 0.25]);
    const net = Math.round(list * (1 - tradeRate));
    return ch3_discountFrom({ rng, kind: 'trade', side: pick(rng, ['sell', 'buy']), list, tradeRate, credit: rng() < 0.7,
      cost: Math.max(100, roundTo(net * (randInt(rng, 55, 80) / 100), 100)), day, shop });
  }
  const base = randInt(rng, 10, 600) * 1000;
  const cashRate = pick(rng, [0.02, 0.03]);
  const within = rng() < 0.75;
  return ch3_discountFrom({ rng, kind: k < 0.65 ? 'recv' : 'pay', base, cashRate, within, day, shop,
    cost: Math.max(100, roundTo(base * (randInt(rng, 55, 80) / 100), 100)),
    payDay: day + (within ? randInt(rng, 2, 10) : randInt(rng, 11, 20)) });
}

// ---- 5. gifts / samples ----
function ch3_giftFrom(params) {
  const rng = ch3_rngFor(params);
  const { qty, cost, market } = params;
  const day = params.day || 8;
  const shop = params.shop || ch3_SHOPS[0];
  const goods = params.goods ? params.goods + ' ' : '';
  const totalCost = qty * cost;
  const mkt = qty * market;
  const vat = vatOf(mkt);
  const text = ch3_date(day) + ' ' + shop + ' (ระบบ Perpetual) แจกสินค้า ' + goods + 'เป็นตัวอย่าง/ของแถมให้ลูกค้า ' + qty +
    ' ชิ้น ต้นทุนชิ้นละ ' + ch3_m(cost) + ' บาท ราคาตลาดชิ้นละ ' + ch3_m(market) + ' บาท (ยังไม่รวม VAT 7%)\nให้บันทึกรายการแจกสินค้า';
  const entries = [[ch3_L('promoExpense', totalCost + vat, 0), ch3_L('inventory', 0, totalCost), ch3_L('outputVat', 0, vat)]];
  const reason = 'การแจกสินค้าถือเป็นการขาย ต้องคิดภาษีขายจากราคาตลาด: ' + ch3_m(market) + ' × ' + qty + ' × 7% = ' + ch3_m(vat) +
    ' (ไม่คิดจากต้นทุน) สินค้าออกจากสต๊อกตามต้นทุน ' + ch3_m(qty) + ' × ' + ch3_m(cost) + ' = ' + ch3_m(totalCost) +
    ' ค่าส่งเสริมการขาย = ต้นทุน + ภาษีขาย = ' + ch3_m(totalCost) + ' + ' + ch3_m(vat) + ' = ' + ch3_m(totalCost + vat);
  return ch3_journal('ch3.gift', 'แจกสินค้าตัวอย่าง/ของแถม', rng, text, entries, reason);
}
function ch3_giftGen(rng) {
  const cost = randInt(rng, 5, 150) * 100;
  const market = Math.max(cost + 100, roundTo(cost * (randInt(rng, 120, 180) / 100), 100));
  return ch3_giftFrom({ rng, qty: randInt(rng, 2, 20), cost, market, day: randInt(rng, 1, 28),
    shop: pick(rng, ch3_SHOPS), goods: pick(rng, ch3_GOODS) });
}

// ---- 6. suspended VAT (services) ----
function ch3_suspendedFrom(params) {
  const rng = ch3_rngFor(params);
  const kind = params.kind || 'buy';
  const base = params.base;
  const vat = vatOf(base);
  const total = base + vat;
  const d1 = params.day || 4;
  const d2 = params.payDay || d1 + 12;
  const shop = params.shop || ch3_SHOPS[0];
  const svc = params.service || ch3_SERVICES[0];
  const head = shop + ' (ระบบ Perpetual) ';
  const note = ' (VAT ของค่าบริการถึงกำหนดเมื่อมีการจ่าย/รับเงิน)';
  if (kind === 'buy') {
    const text = ch3_date(d1) + ' ' + head + 'ใช้บริการ' + svc + ' ราคา ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%) ได้รับใบแจ้งหนี้ เป็นเงินเชื่อ\n' +
      ch3_date(d2) + ' จ่ายชำระค่าบริการทั้งจำนวน (รวม VAT)' + note + '\nให้บันทึกรายการวันที่ได้รับใบแจ้งหนี้ และวันที่จ่ายเงิน (2 รายการ)';
    const entries = [
      [ch3_L('serviceExpense', base, 0), ch3_L('suspInputVat', vat, 0), ch3_L('ap', 0, total)],
      [ch3_L('ap', total, 0), ch3_L('inputVat', vat, 0), ch3_L('cash', 0, total), ch3_L('suspInputVat', 0, vat)],
    ];
    const reason = 'VAT = ' + ch3_m(base) + ' × 7% = ' + ch3_m(vat) + '. วันที่ได้รับใบแจ้งหนี้ ภาษียังไม่ถึงกำหนดจึงพักไว้ที่ภาษีซื้อยังไม่ถึงกำหนด (Dr) ' +
      'เจ้าหนี้ ' + ch3_m(total) + '. วันจ่ายเงิน ภาษีถึงกำหนด จึงโอนภาษีซื้อยังไม่ถึงกำหนด → ภาษีซื้อ ' + ch3_m(vat) + ' และจ่ายเงินสดชำระเจ้าหนี้ ' + ch3_m(total);
    return ch3_journal('ch3.suspended', 'ภาษีซื้อยังไม่ถึงกำหนด (ซื้อบริการ)', rng, text, entries, reason);
  }
  const text = ch3_date(d1) + ' ' + head + 'ให้บริการ' + svc + 'แก่ลูกค้า ค่าบริการ ' + ch3_m(base) + ' บาท (ยังไม่รวม VAT 7%) ออกใบแจ้งหนี้ เป็นเงินเชื่อ\n' +
    ch3_date(d2) + ' ลูกค้าชำระค่าบริการทั้งจำนวน (รวม VAT)' + note + '\nให้บันทึกรายการวันที่ออกใบแจ้งหนี้ และวันที่รับเงิน (2 รายการ)';
  const entries = [
    [ch3_L('ar', total, 0), ch3_L('serviceRevenue', 0, base), ch3_L('suspOutputVat', 0, vat)],
    [ch3_L('cash', total, 0), ch3_L('suspOutputVat', vat, 0), ch3_L('ar', 0, total), ch3_L('outputVat', 0, vat)],
  ];
  const reason = 'VAT = ' + ch3_m(base) + ' × 7% = ' + ch3_m(vat) + '. วันที่ออกใบแจ้งหนี้ ภาษียังไม่ถึงกำหนดจึงเครดิตภาษีขายยังไม่ถึงกำหนด ลูกหนี้ ' + ch3_m(total) +
    '. วันที่รับเงิน ภาษีถึงกำหนด จึงโอนภาษีขายยังไม่ถึงกำหนด → ภาษีขาย ' + ch3_m(vat) + ' และรับเงินสดชำระลูกหนี้ ' + ch3_m(total);
  return ch3_journal('ch3.suspended', 'ภาษีขายยังไม่ถึงกำหนด (ให้บริการ)', rng, text, entries, reason);
}
function ch3_suspendedGen(rng) {
  const day = randInt(rng, 1, 12);
  return ch3_suspendedFrom({ rng, kind: rng() < 0.5 ? 'buy' : 'sell', base: randInt(rng, 5, 400) * 100, day,
    payDay: day + randInt(rng, 5, 16), shop: pick(rng, ch3_SHOPS), service: pick(rng, ch3_SERVICES) });
}

// ---- 7. month-end close ----
function ch3_closeFrom(params) {
  const rng = ch3_rngFor(params);
  const { output, input } = params;
  const shop = params.shop || ch3_SHOPS[0];
  const pay = output > input;
  const diff = Math.abs(output - input);
  const text = shop + ' (ระบบ Perpetual) สิ้นเดือน ก.ย. 25x1 มียอดคงเหลือภาษีขาย ' + ch3_m(output) + ' บาท และภาษีซื้อ ' + ch3_m(input) +
    ' บาท\nให้บันทึกรายการปิดบัญชีภาษี ณ 30 ก.ย. 25x1 และรายการจ่ายภาษีวันที่ 15 ต.ค. 25x1 (ถ้ามี)';
  let entries;
  let reason;
  if (pay) {
    entries = [
      [ch3_L('outputVat', output, 0), ch3_L('inputVat', 0, input), ch3_L('vatPayable', 0, diff)],
      [ch3_L('vatPayable', diff, 0), ch3_L('cash', 0, diff)],
    ];
    reason = 'ภาษีขาย ' + ch3_m(output) + ' > ภาษีซื้อ ' + ch3_m(input) + ' ต้องชำระ ' + ch3_m(diff) +
      ': ปิดภาษีขาย (Dr) และภาษีซื้อ (Cr) แล้วเครดิตภาษีมูลค่าเพิ่มค้างจ่ายส่วนต่าง; วันที่ 15 ต.ค. จ่ายภาษี Dr ภาษีมูลค่าเพิ่มค้างจ่าย / Cr เงินสด ' + ch3_m(diff);
  } else {
    entries = [[ch3_L('outputVat', output, 0), ch3_L('vatReceivable', diff, 0), ch3_L('inputVat', 0, input)]];
    reason = 'ภาษีซื้อ ' + ch3_m(input) + ' > ภาษีขาย ' + ch3_m(output) + ' ขอคืนได้ ' + ch3_m(diff) +
      ': ปิดภาษีขายและภาษีซื้อ แล้วเดบิตลูกหนี้กรมสรรพากร (ขอคืนภาษี) ส่วนต่าง ไม่มีรายการจ่ายภาษี';
  }
  return ch3_journal('ch3.close', 'ปิดภาษีสิ้นเดือน', rng, text, entries, reason);
}
function ch3_closeGen(rng) {
  const { output, input } = ch3_drawOutIn(rng);
  return ch3_closeFrom({ rng, output, input, shop: pick(rng, ch3_SHOPS) });
}

// ---- summaries ----
function ch3_card(rule, pattern, example) {
  return '<p><b>หลัก:</b> ' + rule + '</p><p><b>รูปแบบ:</b><br>' + pattern + '</p><p><b>ตัวอย่าง:</b><br>' + example + '</p>';
}

const CH3 = {

// ================= 1. classify =================
function ch4_diagClassify(problem) {
  return (answers) => {
    const issues = [];
    problem.items.forEach((it, i) => {
      const a = answers[i];
      if (!a || a === it.answer) return;
      if (it.answer === 'period' && ch4_PRODUCT.includes(a)) {
        issues.push({ code: 'ch4.period-as-product', msg: it.text + ' — ' + MISTAKE_LABELS_CH4['ch4.period-as-product'] });
      } else if (it.answer === 'oh' && (a === 'dm' || a === 'dl')) {
        issues.push({ code: 'ch4.indirect-as-direct', msg: it.text + ' — ' + MISTAKE_LABELS_CH4['ch4.indirect-as-direct'] });
      }
    });
    return issues;
  };
}

function ch4_classifyFrom(params) {
  const items = params.items.map((it) => ({ text: it.text, answer: it.answer }));
  const explain = items.map((it) => it.text + ' → ' + ch4_CAT_NAME[it.answer]).join('\n') +
    '\nเหตุผล: ต้นทุนการผลิต = วัตถุดิบทางตรง + ค่าแรงงานทางตรง + ค่าใช้จ่ายการผลิต (รวมวัตถุดิบ/แรงงานทางอ้อม); ค่าใช้จ่ายขายและบริหารเป็นต้นทุนงวดเวลา';
  const p = {
    topicId: 'ch4.classify', mode: 'classify', title: 'จัดหมวดต้นทุนของโรงงานผลิต',
    text: 'บริษัทผลิตสินค้าแห่งหนึ่งมีรายการต้นทุนดังต่อไปนี้ จงจัดแต่ละรายการเป็น วัตถุดิบทางตรง ค่าแรงงานทางตรง ค่าใช้จ่ายการผลิต หรือค่าใช้จ่ายงวดเวลา (ขายและบริหาร)',
    explain, categories: ch4_CATS.map((c) => ({ ...c })), items,
  };
  p.diagnoseClassify = ch4_diagClassify(p);
  return p;
}
function ch4_classifyGen(rng) {
  const chosen = ch4_CATS.map((c) => pick(rng, ch4_BANK.filter((b) => b.answer === c.id)));
  const rest = shuffle(rng, ch4_BANK.filter((b) => !chosen.includes(b))).slice(0, 4);
  return ch4_classifyFrom({ items: shuffle(rng, [...chosen, ...rest]) });
}

// ================= 2. entries =================
function ch4_explain(entries, reason) {
  const blocks = entries.map((entry, i) => {
    const dr = entry.filter((l) => l.dr > 0).map((l) => 'Dr ' + ch4_name(l.acct) + ' ' + ch4_m(l.dr));
    const cr = entry.filter((l) => l.cr > 0).map((l) => '    Cr ' + ch4_name(l.acct) + ' ' + ch4_m(l.cr));
    return (entries.length > 1 ? '(' + (i + 1) + ') ' : '') + [...dr, ...cr].join('\n');
  });
  return blocks.join('\n') + '\nเหตุผล: ' + reason;
}

// Fires when indirect cost was debited to WIP (WIP = direct + indirect) instead of MOH.
function ch4_diagIndirect(direct, indirect) {
  return (got) => {
    if (Math.abs(ch4_amt(got, 'wip') - (direct + indirect)) >= 0.5) return [];
    return [{ code: 'ch4.indirect-to-wip', acct: 'wip', msg: MISTAKE_LABELS_CH4['ch4.indirect-to-wip'] }];
  };
}

    case 'payroll':
      text = d + ' ค่าแรงโรงงานที่เกิดขึ้นสำหรับเดือนนี้ ' + ch4_m(params.amount) + ' บาท ยังไม่ได้จ่าย';
      entries = [[ch4_L('factoryLabor', params.amount, 0), ch4_L('wagesPayable', 0, params.amount)]];
      reason = 'ค่าแรงโรงงานทั้งหมดเข้าบัญชีคุมค่าแรงงานโรงงานก่อน ยังไม่จ่ายจึงเป็นค่าแรงค้างจ่าย';
      break;
    case 'moh': {
      const o = ch4_OTHER_OH[params.sub];
      text = d + ' ' + o.th(params.amount);
      entries = [[ch4_L('moh', params.amount, 0), ch4_L(o.cr, 0, params.amount)]];
      reason = o.why;
      break;
    }
    case 'issue': {
      const t = params.direct + params.indirect;
      text = d + ' ' + factory + ' เบิกวัตถุดิบไปใช้ในการผลิต ' + ch4_m(t) + ' บาท เป็นวัตถุดิบทางตรง ' + ch4_m(params.direct) +
        ' บาท และวัตถุดิบทางอ้อม ' + ch4_m(params.indirect) + ' บาท';
      entries = [[ch4_L('wip', params.direct, 0), ch4_L('moh', params.indirect, 0), ch4_L('rawMaterials', 0, t)]];
      reason = 'วัตถุดิบทางตรงเข้า WIP ส่วนวัตถุดิบทางอ้อมเป็น MOH';
      diag = ch4_diagIndirect(params.direct, params.indirect);
      break;
    }
    case 'labor': {
      const t = params.direct + params.indirect;
      text = d + ' โอนค่าแรงโรงงาน ' + ch4_m(t) + ' บาท เป็นค่าแรงงานทางตรง ' + ch4_m(params.direct) +
        ' บาท และค่าแรงงานทางอ้อม ' + ch4_m(params.indirect) + ' บาท';
      entries = [[ch4_L('wip', params.direct, 0), ch4_L('moh', params.indirect, 0), ch4_L('factoryLabor', 0, t)]];
      reason = 'ค่าแรงงานทางตรงเข้า WIP ส่วนค่าแรงงานทางอ้อมเป็น MOH';
      diag = ch4_diagIndirect(params.direct, params.indirect);
      break;
    }
    case 'apply': {
      const amt = (params.dl * params.rate) / 100;
      text = d + ' ปันส่วนค่าใช้จ่ายการผลิตเข้างานระหว่างทำ ในอัตราร้อยละ ' + params.rate + ' ของค่าแรงงานทางตรง ' +
        '(ค่าแรงงานทางตรง ' + ch4_m(params.dl) + ' บาท)';
      entries = [[ch4_L('wip', amt, 0), ch4_L('moh', 0, amt)]];
      reason = 'OH ที่ปันส่วน = ' + ch4_m(params.dl) + ' × ' + params.rate + '% = ' + ch4_m(amt) + ' Dr WIP / Cr MOH';
      break;
    }
    case 'complete':
      text = d + ' ผลิตงานเสร็จและโอนสินค้า' + product + 'เข้าคลังสินค้าสำเร็จรูป ต้นทุน ' + ch4_m(params.amount) + ' บาท';
      entries = [[ch4_L('fg', params.amount, 0), ch4_L('wip', 0, params.amount)]];
      reason = 'งานเสร็จโอนต้นทุนจากงานระหว่างทำไปสินค้าสำเร็จรูป';
      break;
    case 'sell':
      text = d + ' ขายสินค้าสำเร็จรูปเป็นเงินเชื่อ ราคาขาย ' + ch4_m(params.price) + ' บาท ต้นทุนผลิต ' + ch4_m(params.cost) + ' บาท';
      entries = [
        [ch4_L('ar', params.price, 0), ch4_L('sales', 0, params.price)],
        [ch4_L('cogs', params.cost, 0), ch4_L('fg', 0, params.cost)],
      ];
      reason = 'ขายต้องลง 2 รายการ: รับรู้รายได้ และตัดต้นทุนขายออกจากสินค้าสำเร็จรูป';
      break;
    default:
      throw new Error('unknown kind ' + kind);
  }
  const p = {
    topicId: 'ch4.entries', mode: 'journal', title: 'ลงรายการบัญชีธุรกิจผลิตสินค้า',
    text, explain: ch4_explain(entries, reason), accounts: params.accounts || shuffle(params.rng || makeRng(7), ch4_ENTRY_ACCTS), entries,
  };
  if (diag) p.diagnose = diag;
  return p;
}

const ch4_KINDS = ['buy', 'payroll', 'moh', 'issue', 'labor', 'apply', 'complete', 'sell'];
function ch4_entriesGen(rng) {
  const kind = pick(rng, ch4_KINDS);
  const params = { kind, rng, factory: pick(rng, ch4_FACTORIES), product: pick(rng, ch4_PRODUCTS), day: randInt(rng, 2, 28) };
  const k = (lo, hi, step) => randInt(rng, lo / step, hi / step) * step;
  if (kind === 'buy') params.amount = k(10000, 80000, 1000);
  else if (kind === 'payroll') params.amount = k(20000, 100000, 1000);
  else if (kind === 'moh') { params.sub = pick(rng, ['utilities', 'repairs', 'dep']); params.amount = k(2000, 15000, 500); }
  else if (kind === 'issue') { params.direct = k(10000, 60000, 1000); params.indirect = k(1000, 8000, 500); }
  else if (kind === 'labor') { params.direct = k(10000, 60000, 1000); params.indirect = k(2000, 12000, 1000); }
  else if (kind === 'apply') { params.dl = k(10000, 60000, 1000); params.rate = pick(rng, [40, 50, 60, 80, 100, 120, 150]); }
  else if (kind === 'complete') params.amount = k(30000, 150000, 1000);
  else { params.cost = k(20000, 120000, 1000); params.price = params.cost + k(5000, 40000, 1000); }
  return ch4_entriesFrom(params);
}

// ================= 3. cogm =================
function ch4_calc(n) {
  const ind = n.indirect;
  const parts = n.ohParts || null;
  const ohOther = parts ? parts.indirectLabor + parts.utilities + parts.depreciation : n.ohOther;
  const rmAvailable = n.rmBeg + n.rmBuy;
  const rmUsed = rmAvailable - n.rmEnd;
  const dmUsed = rmUsed - ind;
  const totalOverhead = ind + ohOther;
  const totalMfg = dmUsed + n.dl + totalOverhead;
  const totalInProcess = totalMfg + n.wipBeg;
  const cogm = totalInProcess - n.wipEnd;
  const goodsAvailable = n.fgBeg + cogm;
  const cogs = goodsAvailable - n.fgEnd;
  return { ...n, ohOther, parts, rmAvailable, rmUsed, dmUsed, totalOverhead, totalMfg, totalInProcess, cogm, goodsAvailable, cogs };
}

function ch4_diagPair(keyA, keyB, valA, valB) {
  return (answers) => {
    if (valA === valB) return [];
    const num = (k) => {
      const raw = answers[k];
      if (typeof raw !== 'string' || raw.trim() === '') return null;
      const n = Number(raw.replace(/[,\s]/g, ''));
      return Number.isFinite(n) ? n : null;
    };
    const issues = [];
    if (num(keyA) !== null && Math.abs(num(keyA) - valB) <= 0.5) issues.push({ code: 'ch4.cogm-cogs-confused', cell: keyA, msg: MISTAKE_LABELS_CH4['ch4.cogm-cogs-confused'] });
    if (num(keyB) !== null && Math.abs(num(keyB) - valA) <= 0.5) issues.push({ code: 'ch4.cogm-cogs-confused', cell: keyB, msg: MISTAKE_LABELS_CH4['ch4.cogm-cogs-confused'] });
    return issues;
  };
}

function ch4_setting(params) {
  return { factory: params.factory || ch4_FACTORIES[0], product: params.product || ch4_PRODUCTS[0] };
}
function ch4_dataText(c, set) {
  const lines = [
    set.factory + ' ผลิต' + set.product + ' มีข้อมูลสำหรับเดือนนี้ (หน่วย: บาท)',
    'วัตถุดิบต้นงวด ' + ch4_m(c.rmBeg) + ' ซื้อวัตถุดิบ ' + ch4_m(c.rmBuy) + ' วัตถุดิบปลายงวด ' + ch4_m(c.rmEnd),
    'วัตถุดิบทางอ้อมที่ใช้ ' + ch4_m(c.indirect) + ' (รวมอยู่ในวัตถุดิบที่ใช้ไป)',
    'ค่าแรงงานทางตรง ' + ch4_m(c.dl),
  ];
  if (c.parts) {
    lines.push('ค่าแรงงานทางอ้อม ' + ch4_m(c.parts.indirectLabor) + ' ค่าไฟฟ้าโรงงาน ' + ch4_m(c.parts.utilities) +
      ' ค่าเสื่อมราคาโรงงาน ' + ch4_m(c.parts.depreciation));
  } else {
    lines.push('ค่าใช้จ่ายการผลิตอื่น ๆ ' + ch4_m(c.ohOther));
  }
  lines.push('งานระหว่างทำต้นงวด ' + ch4_m(c.wipBeg) + ' ปลายงวด ' + ch4_m(c.wipEnd));
  lines.push('สินค้าสำเร็จรูปต้นงวด ' + ch4_m(c.fgBeg) + ' ปลายงวด ' + ch4_m(c.fgEnd));
  return lines.join('\n');
}

function ch4_cogmFrom(params) {
  const c = ch4_calc(params);
  const set = ch4_setting(params);
  const G = (key, value) => ({ key, value, given: true });
  const X = (key, value) => ({ key, value, given: false });
  const row = (label, cell) => ({ label, cells: [cell] });
  const ohLines = c.parts
    ? [row('  วัตถุดิบทางอ้อม', G('ohIndirectMaterials', c.indirect)), row('  ค่าแรงงานทางอ้อม', G('ohIndirectLabor', c.parts.indirectLabor)),
      row('  ค่าไฟฟ้าโรงงาน', G('ohUtilities', c.parts.utilities)), row('  ค่าเสื่อมราคาโรงงาน', G('ohDepreciation', c.parts.depreciation))]
    : [row('  วัตถุดิบทางอ้อม', G('ohIndirectMaterials', c.indirect)), row('  ค่าใช้จ่ายการผลิตอื่น ๆ', G('ohOther', c.ohOther))];
  const rows = [
    row('วัตถุดิบต้นงวด', G('rmBeg', c.rmBeg)),
    row('บวก ซื้อวัตถุดิบ', G('rmPurchases', c.rmBuy)),
    row('วัตถุดิบที่มีไว้ใช้', X('rmAvailable', c.rmAvailable)),
    row('หัก วัตถุดิบปลายงวด', G('rmEnd', c.rmEnd)),
    row('วัตถุดิบที่ใช้ไป', X('rmUsed', c.rmUsed)),
    row('หัก วัตถุดิบทางอ้อม', G('indirectMaterials', c.indirect)),
    row('วัตถุดิบทางตรงที่ใช้ไป', X('dmUsed', c.dmUsed)),
    row('ค่าแรงงานทางตรง', G('directLabor', c.dl)),
    ...ohLines,
    row('รวมค่าใช้จ่ายการผลิต', X('totalOverhead', c.totalOverhead)),
    row('ต้นทุนการผลิตรวม', X('totalManufacturingCost', c.totalMfg)),
    row('บวก งานระหว่างทำต้นงวด', G('wipBeg', c.wipBeg)),
    row('ต้นทุนงานระหว่างทำรวม', X('totalCostInProcess', c.totalInProcess)),
    row('หัก งานระหว่างทำปลายงวด', G('wipEnd', c.wipEnd)),
    row('ต้นทุนผลิตสินค้าสำเร็จรูป (COGM)', X('cogm', c.cogm)),
    row('บวก สินค้าสำเร็จรูปต้นงวด', G('fgBeg', c.fgBeg)),
    row('สินค้าที่พร้อมขาย', X('goodsAvailable', c.goodsAvailable)),
    row('หัก สินค้าสำเร็จรูปปลายงวด', G('fgEnd', c.fgEnd)),
    row('ต้นทุนขาย (COGS)', X('cogs', c.cogs)),
  ];
  const explain = [
    'วัตถุดิบที่ใช้ไป = ' + ch4_m(c.rmBeg) + ' + ' + ch4_m(c.rmBuy) + ' − ' + ch4_m(c.rmEnd) + ' = ' + ch4_m(c.rmUsed),
    'วัตถุดิบทางตรงใช้ไป = ' + ch4_m(c.rmUsed) + ' − ' + ch4_m(c.indirect) + ' (ทางอ้อม) = ' + ch4_m(c.dmUsed),
    'ค่าใช้จ่ายการผลิต = ' + ch4_m(c.indirect) + ' + ' + ch4_m(c.ohOther) + ' = ' + ch4_m(c.totalOverhead),
    'ต้นทุนการผลิตรวม = ' + ch4_m(c.dmUsed) + ' + ' + ch4_m(c.dl) + ' + ' + ch4_m(c.totalOverhead) + ' = ' + ch4_m(c.totalMfg),
    'COGM = ' + ch4_m(c.totalMfg) + ' + ' + ch4_m(c.wipBeg) + ' − ' + ch4_m(c.wipEnd) + ' = ' + ch4_m(c.cogm),
    'COGS = ' + ch4_m(c.fgBeg) + ' + ' + ch4_m(c.cogm) + ' − ' + ch4_m(c.fgEnd) + ' = ' + ch4_m(c.cogs),
  ].join('\n');
  return {
    topicId: 'ch4.cogm', mode: 'table', title: 'งบต้นทุนการผลิตและต้นทุนขาย',
    text: ch4_dataText(c, set) + '\nจงจัดทำงบต้นทุนการผลิตสินค้าที่ผลิตเสร็จและคำนวณต้นทุนขาย',
    explain, columns: ['รายการ', 'จำนวนเงิน (บาท)'], rows,
    diagnoseTable: ch4_diagPair('cogm', 'cogs', c.cogm, c.cogs),
    values: c,
  };
}

function ch4_drawNumbers(rng) {
  const k = (lo, hi, step) => randInt(rng, lo / step, hi / step) * step;
  const n = {
    rmBeg: k(2000, 8000, 500), rmBuy: k(10000, 30000, 1000), rmEnd: k(1000, 6000, 500), indirect: k(1000, 3000, 500),
    dl: k(10000, 30000, 1000), wipBeg: k(2000, 9000, 500), wipEnd: k(2000, 9000, 500), fgBeg: k(3000, 10000, 500), fgEnd: k(3000, 10000, 500),
    ohParts: { indirectLabor: k(2000, 6000, 500), utilities: k(1000, 4000, 500), depreciation: k(1000, 4000, 500) },
  };
  return n;
}
function ch4_cogmGen(rng) {
  return ch4_cogmFrom({ ...ch4_drawNumbers(rng), factory: pick(rng, ch4_FACTORIES), product: pick(rng, ch4_PRODUCTS) });
}

// ================= 4. flow =================
function ch4_flowFrom(params) {
  const c = ch4_calc(params);
  const set = ch4_setting(params);
  const N = (key) => ({ key, value: null, given: true });
  const G = (key, value) => ({ key, value, given: true });
  const X = (key, value, colLabel) => ({ key, value, given: false, colLabel });
  const ohApplied = c.totalOverhead;
  const rows = [
    { label: 'วัตถุดิบ (Raw materials)', cells: [G('rm.beg', c.rmBeg), G('rm.add1', c.rmBuy), N('rm.add2'), X('rm.out', c.rmUsed, 'เบิกใช้ทั้งหมด (ตรง+อ้อม)'), G('rm.end', c.rmEnd)] },
    { label: 'งานระหว่างทำ (WIP)', cells: [G('wip.beg', c.wipBeg), X('wip.add1', c.dmUsed, 'รับโอน DM (ทางตรง)'), G('wip.add2', c.dl + ohApplied), X('wip.out', c.cogm), G('wip.end', c.wipEnd)] },
    { label: 'สินค้าสำเร็จรูป (FG)', cells: [G('fg.beg', c.fgBeg), X('fg.add1', c.cogm), N('fg.add2'), X('fg.out', c.cogs), G('fg.end', c.fgEnd)] },
    { label: 'ต้นทุนขาย (COGS)', cells: [G('cogs.beg', 0), X('cogs.add1', c.cogs), N('cogs.add2'), N('cogs.out'), X('cogs.end', c.cogs)] },
  ];
  const explain = [
    'RM: ใช้ไป = ' + ch4_m(c.rmBeg) + ' + ' + ch4_m(c.rmBuy) + ' − ' + ch4_m(c.rmEnd) + ' = ' + ch4_m(c.rmUsed) +
      ' (ทางตรง ' + ch4_m(c.dmUsed) + ' เข้า WIP, ทางอ้อม ' + ch4_m(c.indirect) + ' เข้า MOH)',
    'WIP: รับโอนวัตถุดิบทางตรง ' + ch4_m(c.dmUsed) + ' + ค่าแรงทางตรง ' + ch4_m(c.dl) + ' + OH ปันส่วน ' + ch4_m(ohApplied) +
      ' → โอนออก COGM = ' + ch4_m(c.wipBeg) + ' + ' + ch4_m(c.dmUsed + c.dl + ohApplied) + ' − ' + ch4_m(c.wipEnd) + ' = ' + ch4_m(c.cogm),
    'FG: ' + ch4_m(c.fgBeg) + ' + ' + ch4_m(c.cogm) + ' − ' + ch4_m(c.fgEnd) + ' = ' + ch4_m(c.cogs) + ' โอนไปต้นทุนขาย',
    'COGS = ' + ch4_m(c.cogs),
  ].join('\n');
  return {
    topicId: 'ch4.flow', mode: 'table', title: 'การไหลของต้นทุน RM → WIP → FG → COGS',
    text: ch4_dataText(c, set) + '\nถือว่าค่าใช้จ่ายการผลิตที่ปันส่วนเข้างานระหว่างทำเท่ากับค่าใช้จ่ายการผลิตจริง จงกรอกการไหลของต้นทุนในแต่ละกล่อง',
    explain,
    columns: ['กล่อง', 'ต้นงวด', 'เพิ่ม: ซื้อ / รับโอน', 'เพิ่ม: ค่าแรง+OH', 'โอนออก', 'ปลายงวด'],
    rows,
    diagnoseTable: ch4_diagPair('wip.out', 'fg.out', c.cogm, c.cogs),
    values: c,
  };
}
function ch4_flowGen(rng) {
  return ch4_flowFrom({ ...ch4_drawNumbers(rng), factory: pick(rng, ch4_FACTORIES), product: pick(rng, ch4_PRODUCTS) });
}

// [begin, end] pair with a non-zero change that never goes below one step
function ch5_pair(rng, lo, hi, step, dlo, dhi) {

function ch5_diagClassify(problem) {
  return (answers) => {
    const issues = [];
    problem.items.forEach((it, i) => {
      const a = answers[i];
      if (!a || a === it.answer) return;
      if (it.text === ch5_DIV_PAID && a === 'op') {
        issues.push({ code: 'ch5.dividends-as-operating', msg: it.text + ' — ' + MISTAKE_LABELS_CH5['ch5.dividends-as-operating'] });
      } else if (it.text === ch5_INT_PAID && a === 'fin') {
        issues.push({ code: 'ch5.interest-paid-as-financing', msg: it.text + ' — ' + MISTAKE_LABELS_CH5['ch5.interest-paid-as-financing'] });
      }
    });
    return issues;
  };
}

function ch5_classifyGen(rng) {

// ================= 2. indirect =================
function ch5_diagSign(rowKeys, expected) {
  return (answers) => {
    const issues = [];
    for (const k of rowKeys) {
      const s = ch5_num(answers, 'sign.' + k);
      if (s === null || s === expected[k].sign) continue;
      if (s === -expected[k].sign && ch5_near(ch5_num(answers, 'amt.' + k), expected[k].amount)) {
        issues.push({ code: 'ch5.sign-flipped', cell: 'sign.' + k, msg: MISTAKE_LABELS_CH5['ch5.sign-flipped'] });
      }
    }
    return issues;
  };
}

  rows.push({ label: 'เงินสดสุทธิจากกิจกรรมดำเนินงาน', cells: [ch5_N('sign.cfo'), ch5_X('cashFromOperations', cfo)] });

  ].join('\n');
  const explain = [

function ch5_fullFrom(params) {
  const b = params.beg;
  const e = params.end;
  const s = params.sale;
  const bv = s.cost - s.accum;
  const gl = s.proceeds - bv; // + gain, - loss
  const netIncome = params.sales - params.cogs - params.opex - params.dep - (gl < 0 ? -gl : 0) + (gl > 0 ? gl : 0);
  const begAssets = b.cash + b.ar + b.inv + b.equip - b.accumDep;
  const begRe = begAssets - b.ap - b.accrued - b.loan - b.shares;
  const endEquip = b.equip - s.cost + params.purchase;
  const endAccum = b.accumDep + params.dep - s.accum;
  const endLoan = b.loan + params.borrow - params.repay;
  const endShares = b.shares + params.issue;
  const endRe = begRe + netIncome - params.dividends;
  const endLiabEquity = e.ap + e.accrued + endLoan + endShares + endRe;
  const endNonCash = e.ar + e.inv + endEquip - endAccum;
  const sfpEndCash = endLiabEquity - endNonCash;
  const adjOps = -gl + params.dep - (e.ar - b.ar) - (e.inv - b.inv) + (e.ap - b.ap) + (e.accrued - b.accrued);
  const cfo = netIncome + adjOps;
  const cfi = s.proceeds - params.purchase;
  const cff = params.borrow - params.repay + params.issue - params.dividends;
  const netChange = cfo + cfi + cff;
  const endingCash = b.cash + netChange;
  const rows = [
    { label: 'เงินสดสุทธิจากกิจกรรมดำเนินงาน (วิธีทางอ้อม)', cells: [ch5_X('cashFromOperations', cfo)] },
    { label: 'เงินสดสุทธิจากกิจกรรมลงทุน', cells: [ch5_X('cashFromInvesting', cfi)] },
    { label: 'เงินสดสุทธิจากกิจกรรมจัดหาเงิน', cells: [ch5_X('cashFromFinancing', cff)] },
    { label: 'เงินสดเพิ่มขึ้น (ลดลง) สุทธิ', cells: [ch5_X('netChange', netChange)] },
    { label: 'เงินสดต้นปี', cells: [ch5_G('beginningCash', b.cash)] },
    { label: 'เงินสดปลายปี', cells: [ch5_X('endingCash', endingCash)] },
  ];
  const two = (label, x, y) => label + ' ปลายปี 25x2 = ' + ch5_m(x) + ' ต้นปี (25x1) = ' + ch5_m(y);

function ch5_fullGen(rng) {
  for (let attempt = 0; attempt < 200; attempt++) {
    const sales = ch5_k(rng, 300000, 450000, 10000);
    const equipCost = ch5_k(rng, 10000, 30000, 1000);
    const accum = ch5_k(rng, 4000, equipCost - 3000, 1000);
    const bv = equipCost - accum;
    let gl = ch5_k(rng, 1000, 4000, 500) * (rng() < 0.5 ? -1 : 1);
    if (bv + gl < 1000) gl = -gl;
    const beg = {
      cash: ch5_k(rng, 20000, 60000, 1000), equip: ch5_k(rng, 120000, 250000, 5000), accumDep: ch5_k(rng, 30000, 60000, 1000),
      loan: ch5_k(rng, 20000, 60000, 5000),
    };
    const ar = ch5_pair(rng, 20000, 50000, 1000, 2000, 10000);
    const inv = ch5_pair(rng, 15000, 40000, 1000, 2000, 8000);
    const ap = ch5_pair(rng, 10000, 30000, 1000, 2000, 8000);
    const accrued = ch5_pair(rng, 3000, 8000, 500, 1000, 2000);
    Object.assign(beg, { ar: ar[0], inv: inv[0], ap: ap[0], accrued: accrued[0] });
    const re = ch5_k(rng, 20000, 50000, 1000);
    beg.shares = beg.cash + beg.ar + beg.inv + beg.equip - beg.accumDep - beg.ap - beg.accrued - beg.loan - re;
    const p = {
      beg, end: { ar: ar[1], inv: inv[1], ap: ap[1], accrued: accrued[1] },
      sales, cogs: Math.round(sales * (0.55 + 0.1 * rng()) / 1000) * 1000, opex: ch5_k(rng, 30000, 60000, 1000),
      dep: ch5_k(rng, 8000, 15000, 500), sale: { cost: equipCost, accum, proceeds: bv + gl },
      purchase: ch5_k(rng, 20000, 60000, 1000),
      borrow: rng() < 0.6 ? ch5_k(rng, 10000, 40000, 5000) : 0, repay: rng() < 0.5 ? ch5_k(rng, 5000, 20000, 5000) : 0,
      issue: rng() < 0.5 ? ch5_k(rng, 10000, 30000, 5000) : 0, dividends: ch5_k(rng, 3000, 20000, 1000),
      company: pick(rng, ch5_COMPANIES),
    };
    if (beg.shares < 10000) continue;
    const q = ch5_fullFrom(p);
    if (q.values.sfp.end.cash >= 5000 && q.values.netIncome > 0) return q;
  }
  return ch5_fullFrom(ch5_FALLBACK);
}

function ch5_directFrom(params) {
  const d = (pair) => pair[1] - pair[0];
  const dAr = d(params.ar), dInv = d(params.inv), dAp = d(params.ap), dPre = d(params.prepaid), dAcc = d(params.accrued), dTax = d(params.taxPayable);
  const adj = (label, dv, plusWhenUp) => (((dv >= 0) === plusWhenUp) ? '+ ' : '− ') + label + (dv >= 0 ? 'เพิ่มขึ้น ' : 'ลดลง ') + ch5_m(Math.abs(dv));
  const customers = params.sales - dAr;
  const suppliers = params.cogs + dInv - dAp;
  const opex = params.opex + dPre - dAcc;
  const tax = params.tax - dTax;
  const cfo = customers - suppliers - opex - tax;
  const netIncome = params.sales - params.cogs - params.opex - params.dep - params.tax;
  const cfoIndirect = netIncome + params.dep - dAr - dInv - dPre + dAp + dAcc + dTax;
  const rows = [
    { label: 'เงินสดรับจากลูกค้า', cells: [ch5_X('cashFromCustomers', customers)] },
    { label: 'หัก เงินสดจ่ายแก่ผู้ขายสินค้า', cells: [ch5_X('cashToSuppliers', suppliers)] },
    { label: 'หัก เงินสดจ่ายค่าใช้จ่ายในการดำเนินงาน', cells: [ch5_X('cashForOperatingExpenses', opex)] },
    { label: 'หัก เงินสดจ่ายภาษีเงินได้', cells: [ch5_X('cashForIncomeTax', tax)] },
    { label: 'เงินสดสุทธิจากกิจกรรมดำเนินงาน', cells: [ch5_X('cashFromOperations', cfo)] },
  ];
  const bal = (label, pair) => label + ' ต้นปี ' + ch5_m(pair[0]) + ' ปลายปี ' + ch5_m(pair[1]);
  const text = [
    'บริษัทแห่งหนึ่งมีข้อมูลสำหรับปีนี้ (หน่วย: บาท)',
    'ขาย ' + ch5_m(params.sales) + ' ต้นทุนขาย ' + ch5_m(params.cogs) + ' ค่าใช้จ่ายในการดำเนินงาน (ไม่รวมค่าเสื่อมราคา) ' + ch5_m(params.opex) +
      ' ค่าเสื่อมราคา ' + ch5_m(params.dep) + ' ภาษีเงินได้ (ค่าใช้จ่าย) ' + ch5_m(params.tax),
    bal('ลูกหนี้การค้า', params.ar), bal('สินค้าคงเหลือ', params.inv), bal('ค่าใช้จ่ายจ่ายล่วงหน้า', params.prepaid),
    bal('เจ้าหนี้การค้า', params.ap), bal('ค่าใช้จ่ายค้างจ่าย', params.accrued), bal('ภาษีเงินได้ค้างจ่าย', params.taxPayable),
    'จงคำนวณเงินสดสุทธิจากกิจกรรมดำเนินงานโดยวิธีทางตรง (กรอกจำนวนเงินเป็นบวกทุกบรรทัด ส่วนที่เป็นเงินสดจ่ายให้กรอกเป็นยอดจ่าย)',
  ].join('\n');
  const explain = [
    'เงินสดรับจากลูกค้า = ขาย ' + ch5_m(params.sales) + ' ' + adj('ลูกหนี้', dAr, false) + ' = ' + ch5_m(customers),
    'เงินสดจ่ายผู้ขาย = ต้นทุนขาย ' + ch5_m(params.cogs) + ' ' + adj('สินค้า', dInv, true) + ' ' + adj('เจ้าหนี้', dAp, false) + ' = ' + ch5_m(suppliers),
    'เงินสดจ่ายค่าใช้จ่าย = ' + ch5_m(params.opex) + ' (ไม่รวมค่าเสื่อมราคา) ' + adj('ค่าใช้จ่ายจ่ายล่วงหน้า', dPre, true) + ' ' + adj('ค้างจ่าย', dAcc, false) + ' = ' + ch5_m(opex),
    'เงินสดจ่ายภาษี = ' + ch5_m(params.tax) + ' ' + adj('ภาษีค้างจ่าย', dTax, false) + ' = ' + ch5_m(tax),
    'เงินสดสุทธิจากกิจกรรมดำเนินงาน = ' + ch5_m(customers) + ' − ' + ch5_m(suppliers) + ' − ' + ch5_m(opex) + ' − ' + ch5_m(tax) + ' = ' + ch5_m(cfo),
    'ค่าเสื่อมราคาไม่ใช่รายการเงินสด จึงไม่นำมาคำนวณ; ผลลัพธ์ต้องเท่ากับวิธีทางอ้อม (' + ch5_m(cfoIndirect) + ')',
  ].join('\n');
  const alt = {
    cashFromCustomers: params.sales + dAr,
    cashToSuppliers: params.cogs - dInv + dAp,
    cashForOperatingExpenses: params.opex - dPre + dAcc,
    cashForIncomeTax: params.tax + dTax,
  };
  const right = { cashFromCustomers: customers, cashToSuppliers: suppliers, cashForOperatingExpenses: opex, cashForIncomeTax: tax };
  const diagnoseTable = (answers) => {
    const issues = [];
    for (const k of Object.keys(alt)) {
      const a = ch5_num(answers, k);
      if (alt[k] !== right[k] && ch5_near(a, alt[k]) && !ch5_near(a, right[k])) {
        issues.push({ code: 'ch5.delta-direction', cell: k, msg: MISTAKE_LABELS_CH5['ch5.delta-direction'] });
      }

    return issues;
  };
  return {
    topicId: 'ch5.direct', mode: 'table', title: 'งบกระแสเงินสด: วิธีทางตรง',
    text, explain, columns: ['รายการ', 'จำนวนเงิน (บาท)'], rows, diagnoseTable,
    values: { cfoIndirect, netIncome },
  };
}

function findSubtopic(id) {

    const s = c.subtopics.find((x) => x.id === id);
    if (s) return s;
  }
  return undefined;
}

function mistakeLabel(code) {
  for (const m of catalog_LABELS) if (Object.hasOwn(m, code)) return m[code];
  if (Object.hasOwn(catalog_GENERIC, code)) return catalog_GENERIC[code];
  return code;
}


// DOM helpers shared by all views. Browser-only (not imported by the engine).

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// h('div', { class: 'x', onclick: fn, html: '<b>..</b>' }, child, 'text', [nested], null)
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
  }
  ui_append(el, children);
  return el;
}

function ui_append(el, children) {
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) ui_append(el, c);
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  }
}

// Small inline SVG icon, decorative (aria-hidden); always pair with a text label.
function svgIcon(name, size) {
  const n = size || 18;
  const span = document.createElement('span');
  span.innerHTML = '<svg width="' + n + '" height="' + n + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + UI_ICONS[name] + '</svg>';
  const svg = span.firstChild;
  svg.classList.add('icon');
  return svg;
}


// Play views: journal, table, classify, calc. Each render* returns a handle:
// { el, readAnswer(), mark(grade), showAnswer(), lock(bool) }.
// Browser-only; nothing here touches the DOM at load time.

const VP_MINUS = '−';

function vp_status(kind, text) {
  const icon = kind === 'ok' ? 'check' : kind === 'bad' ? 'close' : 'warn';
  return h('span', { class: 'vp-status ' + kind }, svgIcon(icon, 14), h('span', null, text));
}

function vp_clearStatus(root) {
  root.querySelectorAll('.vp-status').forEach((n) => n.remove());
  root.querySelectorAll('.is-ok,.is-bad,.is-warn').forEach((n) => n.classList.remove('is-ok', 'is-bad', 'is-warn'));
}

function vp_fmt(n, dp) {
  return formatMoney(n, dp === undefined ? (Number.isInteger(n) ? 0 : 2) : dp);
}

function vp_amount(n) {
  return n ? vp_fmt(n) : '';
}

function vp_num(s) {
  const n = parseMoney(String(s));
  return n === null ? 0 : n;
}

// ---------------- journal ----------------

function renderJournal(problem, opts) {
  const o = opts || {};
  const ids = (problem.accounts || []).slice().sort((a, b) => acctLabel(a).localeCompare(acctLabel(b), 'th'));
  const newLine = () => ({ acct: '', dr: '', cr: '' });
  let entries = [[newLine(), newLine()]];
  let locked = false;
  let marks = null; // { bad:Set<acct>, label } after a check
  const root = h('div', { class: 'vj' });
  const wrap = h('div', { class: 'vj-entries' });
  let totEls = [];

  if (o.showEntryCount && Array.isArray(problem.entries)) {
    root.appendChild(h('p', { class: 'muted vj-count' }, 'ต้องลง ' + problem.entries.length + ' รายการ'));
  }
  root.appendChild(wrap);
  const addEntryBtn = h('button', { class: 'btn', type: 'button', onclick: () => { entries.push([newLine(), newLine()]); draw('entry:' + (entries.length - 1)); } }, '+ เพิ่มรายการ');
  root.appendChild(h('div', { class: 'vj-foot' }, addEntryBtn));

  function totals(ei) {
    let d = 0;
    let c = 0;
    for (const l of entries[ei]) { d += vp_num(l.dr); c += vp_num(l.cr); }
    return { d, c };
  }

  function drawTotal(ei) {
    const el = totEls[ei];
    if (!el) return;
    const { d, c } = totals(ei);
    el.textContent = '';
    el.className = 'vj-total';
    if (d === 0 && c === 0) {
      el.appendChild(h('span', { class: 'muted' }, 'Dr 0 · Cr 0 · ยังไม่ได้กรอกจำนวนเงิน'));
    } else if (Math.abs(d - c) < 0.005) {
      el.classList.add('bal');
      el.appendChild(svgIcon('check', 16));
      el.appendChild(h('span', null, 'Dr ' + vp_fmt(d) + ' = Cr ' + vp_fmt(c) + ' สมดุล'));
    } else {
      el.classList.add('unbal');
      el.appendChild(svgIcon('warn', 16));
      el.appendChild(h('span', null, 'Dr ' + vp_fmt(d) + ' ≠ Cr ' + vp_fmt(c) + ' ไม่สมดุล'));
    }
  }

  function lineStatus(l) {
    if (!marks) return null;
    if (marks.revealed) return vp_status('ok', 'เฉลย');
    if (!l.acct || (vp_num(l.dr) === 0 && vp_num(l.cr) === 0)) return null;
    return marks.bad.has(l.acct) ? vp_status('bad', 'ตรวจบัญชีนี้อีกครั้ง') : vp_status('ok', 'ถูก');
  }

  function drawLine(ei, li) {
    const l = entries[ei][li];
    const tag = 'รายการที่ ' + (ei + 1) + ' บรรทัดที่ ' + (li + 1);
    const opts2 = ids.slice();
    if (l.acct && !opts2.includes(l.acct)) opts2.push(l.acct);
    const sel = h('select', { 'aria-label': 'บัญชี ' + tag, disabled: locked, 'data-focus': 'line:' + ei + ':' + li },
      h('option', { value: '' }, '— เลือกบัญชี —'),
      opts2.map((id) => h('option', { value: id, selected: l.acct === id }, acctLabel(id))));
    sel.addEventListener('change', () => { l.acct = sel.value; clearMarks(); });
    const mkIn = (field, lab) => {
      const inp = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', value: l[field], 'aria-label': lab + ' ' + tag, disabled: locked, class: 'num' });
      inp.addEventListener('input', () => { l[field] = inp.value; clearMarks(); drawTotal(ei); });
      return inp;
    };
    const rm = h('button', { class: 'btn sm jl-rm', type: 'button', 'aria-label': 'ลบบรรทัด ' + tag, disabled: locked || entries[ei].length <= 1, onclick: () => {
      entries[ei].splice(li, 1);
      draw(entries[ei].length ? 'line:' + ei + ':' + Math.max(0, li - 1) : null);
    } }, svgIcon('close', 14), h('span', { class: 'jl-rm-t' }, 'ลบ'));
    const st = lineStatus(l);
    return h('div', { class: 'jl' + (st ? (marks.revealed || !marks.bad.has(l.acct) ? ' is-ok' : ' is-bad') : '') },
      h('div', { class: 'jl-top' }, h('div', { class: 'jl-acct' }, sel), rm),
      h('label', { class: 'jl-dr' }, h('span', { class: 'jl-lab', 'aria-hidden': 'true' }, 'เดบิต (Dr)'), mkIn('dr', 'เดบิต')),
      h('label', { class: 'jl-cr' }, h('span', { class: 'jl-lab', 'aria-hidden': 'true' }, 'เครดิต (Cr)'), mkIn('cr', 'เครดิต')),
      st ? h('div', { class: 'jl-mark' }, st) : null);
  }

  function draw(focusKey) {
    totEls = [];
    wrap.textContent = '';
    entries.forEach((lines, ei) => {
      const totEl = h('p', { class: 'vj-total', 'aria-live': 'polite' });
      totEls.push(totEl);
      const addLine = h('button', { class: 'btn sm', type: 'button', disabled: locked, onclick: () => { lines.push(newLine()); draw('line:' + ei + ':' + (lines.length - 1)); } }, '+ เพิ่มบรรทัด');
      const delEntry = entries.length > 1
        ? h('button', { class: 'btn sm', type: 'button', disabled: locked, 'aria-label': 'ลบรายการที่ ' + (ei + 1), onclick: () => { entries.splice(ei, 1); draw(null); } }, svgIcon('close', 14), 'ลบรายการ')
        : null;
      wrap.appendChild(h('section', { class: 'jentry', 'aria-label': 'รายการที่ ' + (ei + 1), 'data-focus': 'entry:' + ei, tabindex: '-1' },
        entries.length > 1 || o.showEntryCount ? h('h3', { class: 'jentry-h' }, 'รายการที่ ' + (ei + 1)) : null,
        h('div', { class: 'jl-head', 'aria-hidden': 'true' }, h('span', null, 'ชื่อบัญชี'), h('span', null, 'เดบิต (Dr)'), h('span', null, 'เครดิต (Cr)'), h('span', null)),
        lines.map((l, li) => drawLine(ei, li)),
        h('div', { class: 'jentry-foot' }, addLine, delEntry, totEl)));
      drawTotal(ei);
    });
    addEntryBtn.disabled = locked;
    if (focusKey) {
      const t = wrap.querySelector('[data-focus="' + focusKey + '"]');
      if (t) t.focus();
    }
  }

  function clearMarks() {
    if (!marks) return;
    marks = null;
    vp_clearStatus(wrap);
  }

  draw(null);

  return {
    el: root,
    readAnswer() {
      return entries.map((lines) => lines.map((l) => ({ acct: l.acct, dr: vp_num(l.dr), cr: vp_num(l.cr) })));
    },
    mark(grade) {
      const bad = new Set();
      for (const i of grade.issues) if (i.acct) bad.add(i.acct);
      marks = { bad, revealed: false };
      draw(null);
    },
    showAnswer() {
      entries = problem.entries.map((e) => e.map((l) => ({ acct: l.acct, dr: vp_amount(l.dr), cr: vp_amount(l.cr) })));
      marks = { bad: new Set(), revealed: true };
      locked = true;
      draw(null);
    },
    lock(v) {
      locked = !!v;
      draw(null);
    },
  };
}

// ---------------- table ----------------

function renderTable(problem) {
  const controls = {}; // key -> input/select
  const marksEl = {};
  const cols = problem.columns || [];
  const root = h('div', { class: 'vt-wrap', role: 'region', tabindex: '0', 'aria-label': 'ตารางสำหรับกรอก (เลื่อนดูได้)' });

  const head = h('tr', null, cols.map((c, i) => h('th', { scope: 'col', class: i === 0 ? 'vt-first' : 'vt-col' }, c)));
  const body = h('tbody', null, (problem.rows || []).map((row) => {
    const tr = h('tr', null, h('th', { scope: 'row', class: 'vt-first' }, row.label));
    row.cells.forEach((cell, ci) => {
      const colName = cols[ci + 1] || '';
      const td = h('td', { class: 'vt-cell' });
      if (cell.given) {
        if (cell.value !== null && cell.value !== undefined) {
          const isSign = cell.key.startsWith('sign.');
          td.appendChild(h('span', { class: 'num vt-given' }, isSign ? (cell.value > 0 ? '+' : VP_MINUS) : vp_fmt(cell.value, cell.tol === 0.01 || !Number.isInteger(cell.value) ? 2 : 0)));
        } else {
          td.classList.add('vt-empty');
        }
      } else {
        const label = row.label + (cell.colLabel || colName ? ' — ' + (cell.colLabel || colName) : '');
        let ctl;
        if (cell.key.startsWith('sign.')) {
          ctl = h('select', { 'aria-label': label, class: 'vt-sign' },
            h('option', { value: '' }, '—'), h('option', { value: '1' }, '+ บวก'), h('option', { value: '-1' }, VP_MINUS + ' หัก'));
        } else {
          ctl = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': label, class: 'num vt-in' });
        }
        ctl.addEventListener(ctl.tagName === 'SELECT' ? 'change' : 'input', () => clearOne(cell.key));
        controls[cell.key] = ctl;
        const m = h('div', { class: 'vt-mark' });
        marksEl[cell.key] = m;
        if (cell.colLabel) td.appendChild(h('div', { class: 'vt-sub' }, cell.colLabel));
        td.appendChild(ctl);
        td.appendChild(m);
      }
      tr.appendChild(td);
    });
    return tr;
  }));
  root.appendChild(h('table', { class: 'vt' }, h('thead', null, head), body));
  if (problem.topicId === 'ch5.full' || problem.topicId === 'ch5.direct') {
    root.appendChild(h('p', { class: 'vt-hint' }, 'ยอดติดลบใส่ − หรือวงเล็บ เช่น (5,000)'));
  }

  function clearOne(key) {
    marksEl[key].textContent = '';
    controls[key].classList.remove('is-ok', 'is-bad', 'is-warn');
  }
  function setMark(key, kind, text) {
    const m = marksEl[key];
    if (!m) return;
    m.textContent = '';
    controls[key].classList.remove('is-ok', 'is-bad', 'is-warn');
    if (kind) {
      controls[key].classList.add('is-' + kind);
      m.appendChild(vp_status(kind, text));
    }
  }

  return {
    el: root,
    readAnswer() {
      const a = {};
      for (const k of Object.keys(controls)) a[k] = controls[k].value;
      return a;
    },
    mark(grade) {
      for (const k of Object.keys(controls)) {
        const st = grade.cells ? grade.cells[k] : undefined;
        const flagged = grade.issues.some((i) => i.cell === k && i.code !== 'cell-blank' && i.code !== 'cell-wrong');
        if (st === 'ok' && !flagged) setMark(k, 'ok', 'ถูก');
        else if (st === 'blank') setMark(k, 'warn', 'ยังไม่กรอก');
        else setMark(k, 'bad', 'ไม่ถูก');
      }
    },
    showAnswer() {
      for (const row of problem.rows || []) {
        for (const cell of row.cells) {
          if (cell.given) continue;
          const ctl = controls[cell.key];
          ctl.value = cell.key.startsWith('sign.') ? String(cell.value) : vp_fmt(cell.value, cell.tol === 0.01 || !Number.isInteger(cell.value) ? 2 : 0);
          setMark(cell.key, 'ok', 'เฉลย');
        }
      }
    },
    lock(v) {
      for (const k of Object.keys(controls)) controls[k].disabled = !!v;
    },
  };
}

// ---------------- classify ----------------

function renderClassify(problem) {
  const cats = problem.categories || [];
  const items = problem.items || [];
  const answers = items.map(() => '');
  let sel = 0;
  let locked = false;
  const catName = (id) => (cats.find((c) => c.id === id) || { label: id }).label;
  const root = h('div', { class: 'vc' });
  const live = h('p', { class: 'vp-sr', 'aria-live': 'polite' });
  const itemEls = [];
  const chipEls = [];
  const markEls = [];

  const list = h('ul', { class: 'vc-items', 'aria-label': 'รายการที่ต้องจัดหมวด' });
  items.forEach((it, i) => {
    const chip = h('span', { class: 'vc-chip' }, 'ยังไม่เลือกหมวด');
    const mark = h('span', { class: 'vc-mark' });
    const btn = h('button', { class: 'vc-item', type: 'button', 'aria-pressed': 'false', onclick: () => select(i) },
      h('span', { class: 'vc-text' }, it.text), chip);
    itemEls.push(btn);
    chipEls.push(chip);
    markEls.push(mark);
    list.appendChild(h('li', null, btn, mark));
  });
  root.appendChild(h('p', { class: 'muted' }, 'เลือกรายการ แล้วกดหมวดที่ถูกต้อง'));
  root.appendChild(list);

  const catBox = h('div', { class: 'vc-cats', role: 'group', 'aria-label': 'หมวดหมู่' },
    cats.map((c) => h('button', { class: 'btn', type: 'button', onclick: () => assign(c.id) }, c.label)));
  root.appendChild(catBox);
  root.appendChild(live);

  function select(i) {
    sel = i;
    itemEls.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
    itemEls.forEach((b, k) => b.classList.toggle('sel', k === i));
  }
  function paintChip(i) {
    chipEls[i].textContent = answers[i] ? 'หมวด: ' + catName(answers[i]) : 'ยังไม่เลือกหมวด';
    chipEls[i].classList.toggle('set', !!answers[i]);
  }
  function clearMark(i) {
    markEls[i].textContent = '';
    itemEls[i].classList.remove('is-ok', 'is-bad');
  }
  function assign(catId) {
    if (locked) return;
    answers[sel] = catId;
    paintChip(sel);
    clearMark(sel);
    live.textContent = 'จัด "' + items[sel].text + '" เข้าหมวด ' + catName(catId);
    const next = answers.findIndex((a, k) => !a && k !== sel);
    if (next >= 0) select(next);
  }
  select(0);

  function setMark(i, kind, text) {
    markEls[i].textContent = '';
    itemEls[i].classList.remove('is-ok', 'is-bad');
    itemEls[i].classList.add('is-' + kind);
    markEls[i].appendChild(vp_status(kind, text));
  }

  return {
    el: root,
    readAnswer() {
      return answers.slice();
    },
    mark(grade) {
      items.forEach((it, i) => {
        if (grade.items[i]) setMark(i, 'ok', 'ถูก');
        else setMark(i, 'bad', answers[i] ? 'ไม่ถูก' : 'ยังไม่ได้เลือกหมวด');
      });
    },
    showAnswer() {
      items.forEach((it, i) => {
        answers[i] = it.answer;
        paintChip(i);
        setMark(i, 'ok', 'เฉลย');
      });
    },
    lock(v) {
      locked = !!v;
      itemEls.forEach((b) => { b.disabled = locked; });
      catBox.querySelectorAll('button').forEach((b) => { b.disabled = locked; });
    },
  };
}

// ---------------- calc ----------------

function renderCalc(problem) {
  const input = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', class: 'num vcalc-in', id: 'calc-in', 'aria-label': 'คำตอบ' + (problem.unit ? ' (' + problem.unit + ')' : '') });
  const mark = h('div', { class: 'vcalc-mark' });
  input.addEventListener('input', () => { mark.textContent = ''; input.classList.remove('is-ok', 'is-bad'); });
  const root = h('div', { class: 'vcalc' },
    h('label', { class: 'vcalc-row', for: 'calc-in' }, h('span', null, 'คำตอบ'), input, problem.unit ? h('span', { class: 'muted' }, problem.unit) : null),
    mark);
  function setMark(kind, text) {
    mark.textContent = '';
    input.classList.remove('is-ok', 'is-bad');
    input.classList.add('is-' + kind);
    mark.appendChild(vp_status(kind, text));
  }
  return {
    el: root,
    readAnswer() {
      return input.value;
    },
    mark(grade) {
      if (grade.ok) setMark('ok', 'ถูก');
      else setMark('bad', 'ไม่ถูก');
    },
    showAnswer() {
      input.value = vp_fmt(problem.answer, Number.isInteger(problem.answer) ? 0 : 2);
      setMark('ok', 'เฉลย');
    },
    lock(v) {
      input.disabled = !!v;
    },
  };
}

function showGrade(handle, grade) {
  handle.mark(grade);
}



const APP = { state: null, storage: null, lastChapter: 'ch1' };

const APP_MAX_STARS = 99;

function persist() {
  saveState(APP.storage, APP.state);
}

function app_makeStorage() {
  if (/[?&]nostorage(&|=|$)/.test(location.search)) {
    const fail = () => { throw new Error('storage disabled'); };
    return { getItem: fail, setItem: fail, removeItem: fail };
  }
  try {
    const ls = window.localStorage;
    ls.getItem('acct2601115.probe');
    return ls;
  } catch (e) {
    const mem = {};
    return {
      getItem: (k) => (Object.hasOwn(mem, k) ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: (k) => { delete mem[k]; },
    };
  }
}

// ---------- helpers ----------

function app_chapterOf(id) {
  return CHAPTERS.find((c) => c.id === id);
}

function app_chapterStars(ch) {
  return ch.subtopics.reduce((a, s) => a + (APP.state.best[s.id] || 0), 0);
}

function app_starRow(n) {
  const wrap = h('span', { class: 'stars', role: 'img', 'aria-label': n + ' จาก 3 ดาว' });
  for (let i = 1; i <= 3; i++) wrap.appendChild(svgIcon(i <= n ? 'star' : 'starEmpty', 18));
  return wrap;
}

// Where "ฝึกเลย" goes for a mistake code: {href, where}
function app_practiceTarget(code) {
  let best = null;
  for (const c of CHAPTERS) {
    for (const s of c.subtopics) {
      if ((code === s.id || code.startsWith(s.id + '.')) && (!best || s.id.length > best.id.length)) best = s;
    }
  }
  if (best) return { href: '#/play/' + best.id, where: best.title };
  const m = /^(ch\d+)\./.exec(code);
  const ch = m && app_chapterOf(m[1]);
  if (ch) return { href: '#/ch/' + ch.id, where: ch.title };

// ---------- round reducer (pure) ----------

const APP_ROUND_SIZE = 5;

function newRound(subtopic, seed) {
  let problems;
  if (typeof subtopic.genSet === 'function') {
    problems = subtopic.genSet(makeRng(seed));
  } else {
    problems = [];
    for (let k = 0; k < APP_ROUND_SIZE; k++) problems.push(subtopic.gen(makeRng((seed + k * 7919 + 1) >>> 0)));
  }
  return { subtopicId: subtopic.id, problems, i: 0, miss: 0, wrongOnCurrent: 0, revealed: false, done: false };
}

function checkAnswer(round, grade) {
  if (grade.ok) return round;
  return { ...round, miss: round.miss + MISS_WRONG, wrongOnCurrent: round.wrongOnCurrent + 1 };
}

function canReveal(round) {
  return round.wrongOnCurrent >= 2;
}

function reveal(round) {
  if (round.revealed) return round;
  return { ...round, miss: round.miss + MISS_REVEAL, revealed: true };
}

function nextProblem(round) {
  const n = round.i + 1;
  const done = n >= round.problems.length;
  return { ...round, i: done ? round.i : n, done, wrongOnCurrent: 0, revealed: false };
}

// ---------- grading with topic hooks ----------

function app_gradeBase(p, answer) {
  if (p.mode === 'journal') return gradeJournal(p, answer);
  if (p.mode === 'table') return gradeTable(p, answer);
  if (p.mode === 'classify') return gradeClassify(p, answer);
  return gradeCalc(p, answer);
}

function app_gradeProblem(p, answer) {
  const g = app_gradeBase(p, answer);
  if (g.ok) return g;
  let specific = [];
  if (p.mode === 'table' && p.diagnoseTable) specific = p.diagnoseTable(answer) || [];
  else if (p.mode === 'classify' && p.diagnoseClassify) specific = p.diagnoseClassify(answer) || [];
  else if (p.mode === 'calc' && p.diagnoseCalc) {
    const n = parseMoney(String(answer));
    if (n !== null) specific = p.diagnoseCalc(n) || [];
  }
  if (!specific.length) return g;
  let rest = g.issues;
  if (p.mode === 'table') {
    const cells = new Set(specific.filter((i) => i.cell).map((i) => i.cell));
    rest = rest.filter((i) => !(i.cell && cells.has(i.cell)));
  } else if (p.mode === 'classify') {
    rest = rest.filter((i) => !specific.some((s) => p.items.some((it) => i.msg.endsWith(it.text) && s.msg.startsWith(it.text))));
  } else {
    rest = [];
  }
  return { ...g, issues: [...specific, ...rest] };
}

function app_renderProblem(p) {
  const opts = { showEntryCount: !!APP.state.settings.showEntryCount };
  if (p.mode === 'journal') return renderJournal(p, opts);
  if (p.mode === 'table') return renderTable(p);
  if (p.mode === 'classify') return renderClassify(p);
  return renderCalc(p);
}

function app_seed() {
  return (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
}

// ---------- play view ----------

function app_playController(sub, ch, box) {
  let round = newRound(sub, app_seed());
  let phase = 'answer'; // 'answer' | 'solved' | 'revealed'
  let handle = null;
  let feedback = null;
  let actions = null;

  function paintActions() {
    actions.textContent = '';
    if (phase === 'answer') {
      actions.appendChild(h('button', { class: 'btn primary', type: 'button', id: 'btn-check', onclick: onCheck }, 'ตรวจคำตอบ'));
      if (canReveal(round)) {
        actions.appendChild(h('button', { class: 'btn', type: 'button', id: 'btn-reveal', onclick: onReveal }, 'ดูเฉลย'));
      }
    } else {
      const last = round.i >= round.problems.length - 1;
      actions.appendChild(h('button', { class: 'btn primary', type: 'button', id: 'btn-next', onclick: onNext },
        last ? 'ดูผลรอบนี้' : 'ถัดไป', svgIcon('next', 18)));
    }
  }

  function setFeedback(...nodes) {
    feedback.textContent = '';
    for (const n of nodes) if (n) feedback.appendChild(n);
  }

  function onCheck() {
    const p = round.problems[round.i];
    const grade = app_gradeProblem(p, handle.readAnswer());
    showGrade(handle, grade);
    if (grade.ok) {
      phase = 'solved';
      handle.lock(true);
      setFeedback(h('p', { class: 'fb-ok' }, svgIcon('check', 18), h('span', null, 'ถูกต้อง เก่งมาก')));
      paintActions();
      document.getElementById('btn-next').focus();
      return;
    }
    round = checkAnswer(round, grade);
    const codes = new Set(grade.issues.map((i) => i.code).filter(Boolean));
    for (const c of codes) APP.state = recordMistake(APP.state, c);
    persist();
    const msgs = grade.issues.length ? grade.issues : [{ msg: 'คำตอบยังไม่ถูกต้อง ลองตรวจอีกครั้ง' }];
    setFeedback(
      h('p', { class: 'fb-head' }, svgIcon('warn', 18), h('span', null, 'ยังไม่ถูก ลองแก้แล้วตรวจอีกครั้ง')),
      h('ul', { class: 'fb-list' }, msgs.map((i) => h('li', null, svgIcon('close', 14), h('span', null, i.msg)))));
    paintActions();
  }

  function onReveal() {
    const p = round.problems[round.i];
    round = reveal(round);
    phase = 'revealed';
    handle.showAnswer();
    handle.lock(true);
    setFeedback(
      h('p', { class: 'fb-head neutral' }, svgIcon('check', 18), h('span', null, 'เฉลยของข้อนี้')),
      p.explain ? h('div', { class: 'note explain' }, p.explain) : null);
    paintActions();
    document.getElementById('btn-next').focus();
  }

  function onNext() {
    round = nextProblem(round);
    phase = 'answer';
    paint(true);
  }

  function paint(focusProblem) {
    box.textContent = '';
    if (round.done) { paintEnd(); return; }
    const p = round.problems[round.i];
    handle = app_renderProblem(p);
    feedback = h('div', { class: 'feedback', 'aria-live': 'polite', 'aria-atomic': 'false' });
    actions = h('div', { class: 'play-actions' });
    const sumBtn = h('button', { class: 'btn sm', type: 'button' }, 'สรุปสั้น');
    sumBtn.addEventListener('click', () => app_openSummary(sub, sumBtn));
    const heading = h('h2', { class: 'prob-h', id: 'prob-h', tabindex: '-1' }, 'โจทย์ ' + (round.i + 1) + '/' + round.problems.length);
    box.appendChild(h('div', { class: 'play-bar' }, heading, sumBtn));
    box.appendChild(h('section', { class: 'card problem', 'aria-labelledby': 'prob-h' },
      p.title ? h('p', { class: 'problem-title' }, p.title) : null,
      h('p', { class: 'problem-text' }, p.text)));
    box.appendChild(h('section', { class: 'card work', 'aria-label': 'พื้นที่ทำโจทย์' }, handle.el));
    box.appendChild(feedback);
    box.appendChild(actions);
    paintActions();
    if (focusProblem) heading.focus();
  }

  function paintEnd() {
    APP.state = finishRound(APP.state, sub.id, round.miss);
    persist();
    const stars = starsFor(round.miss);
    const best = APP.state.best[sub.id] || stars;
    const heading = h('h2', { class: 'prob-h', id: 'end-h', tabindex: '-1' }, 'จบรอบแล้ว');
    box.appendChild(h('section', { class: 'card end' },
      heading,
      h('div', { class: 'end-stars' }, app_starRow(stars), h('span', null, 'ได้ ' + stars + ' ดาวในรอบนี้')),
      h('p', { class: 'muted' }, 'ดาวสูงสุดของหัวข้อนี้ ', h('span', { class: 'num' }, best + '/3'), ' · คะแนนพลาดรอบนี้ ', h('span', { class: 'num' }, round.miss)),
      h('div', { class: 'play-actions' },
        h('button', { class: 'btn primary', type: 'button', id: 'btn-again', onclick: () => { round = newRound(sub, app_seed()); phase = 'answer'; paint(true); } }, 'เล่นอีกรอบ'),
        app_link('#/ch/' + ch.id, 'btn', 'กลับไปบท'))));
    heading.focus();
  }

  paint(false);
}

    const no = h('button', { class: 'btn', type: 'button' }, 'ยกเลิก');
    resetBox.appendChild(h('div', { class: 'confirm', role: 'alertdialog', 'aria-labelledby': 'confirm-msg' },
      h('p', { id: 'confirm-msg' }, svgIcon('warn', 18), ' ดาว คะแนนสูงสุด และสถิติจุดที่พลาดทั้งหมดจะหายไป และกู้คืนไม่ได้'),
      h('div', { class: 'row-actions' }, yes, no)));
    no.focus();
    no.addEventListener('click', () => { app_render({ keepFocus: 'reset-start' }); });
    yes.addEventListener('click', () => {
      APP.state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      persist();
      app_render({ keepFocus: 'reset-start', message: 'ล้างความคืบหน้าแล้ว' });
    });
  });
  resetBox.appendChild(startBtn);

  return app_page({ href: '#/', label: 'หน้าแรก' }, 'ตั้งค่า',
    h('section', { class: 'card' },
      sw,
      h('p', { class: 'muted', id: 'sw-desc' }, 'เมื่อเปิด โจทย์ลงรายการบัญชีจะบอกว่าต้องลงกี่รายการ (ปิดไว้เป็นค่าเริ่มต้น)')),
    h('section', { class: 'card' },
      h('h2', null, 'ความคืบหน้า'),
      h('p', { class: 'muted' }, 'ลบดาวและสถิติจุดที่พลาดที่เก็บไว้ในเครื่องนี้'),
      resetBox));
}

// ---------- router ----------

function app_route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  const arg = parts[1] ? decodeURIComponent(parts[1]) : '';
  switch (parts[0]) {
    case undefined: return app_viewHome();
    case 'ch': return app_viewChapter(arg);
    case 'play': return app_viewPlay(arg);
    case 'mistakes': return app_viewMistakes();
    case 'settings': return app_viewSettings();
    default: return app_viewNotFound();
  }
}

function app_render(opts) {
  const root = document.getElementById('app');
  const view = app_route();
  root.textContent = '';
  root.appendChild(view);
  const o = opts || {};
  if (o.message) {
    const live = h('p', { class: 'toast', role: 'status' }, svgIcon('check', 16), ' ' + o.message);
    root.querySelector('main').appendChild(live);
  }
  const target = o.keepFocus ? document.getElementById(o.keepFocus) : document.getElementById('main-title');
  if (target) target.focus({ preventScroll: !!o.keepFocus });
  if (!o.keepFocus) window.scrollTo(0, 0);
}

function bootApp() {
  APP.storage = app_makeStorage();
  APP.state = loadState(APP.storage);
  window.addEventListener('hashchange', () => app_render());
  app_render();
}

;bootApp();
</script>
